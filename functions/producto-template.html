<template id="product-view-template">
    <div class="animate-fade-in">

                <li><span class="text-neutral-400">/</span></li>

                <li><span id="breadcrumb-product" class="font-medium text-neutral-900">Producto</span></li>
            </ol>
        </nav>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 xl:gap-12">
            <!-- Image Gallery Section -->
            <div class="space-y-4">
                <div class="aspect-square bg-neutral-100 rounded-lg shadow-sm overflow-hidden">
                    <img id="main-product-image" src="" alt="Imagen principal del producto" class="w-full h-full object-cover transition-transform duration-300 hover:scale-105">
                </div>
                <div id="thumbnail-gallery" class="grid grid-cols-4 gap-3">

                </div>
            </div>

            <!-- Product Information Section -->
            <div class="flex flex-col space-y-6">
                <div class="space-y-2">
                    <span id="product-category" class="text-sm font-medium text-primary-600 uppercase tracking-wider">Categoría</span>
                    <h1 id="product-name" class="text-3xl md:text-4xl font-bold font-display text-neutral-900">Nombre del Producto</h1>
                </div>

                    </div>
                </div>

                <div class="bg-neutral-50 p-6 rounded-lg">
                    <div class="flex items-baseline space-x-3">
                        <span id="product-price" class="text-4xl font-bold font-display text-primary-600">S/ 0.00</span>

                    <div id="discount-badge" class="mt-2 hidden">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-primary-100 text-primary-700">
                            ¡Oferta!
                        </span>
                    </div>
                </div>

                <div class="flex-grow">
                    <h3 class="text-lg font-semibold text-neutral-800 mb-2">Descripción</h3>
                    <div id="product-description" class="prose prose-neutral max-w-none text-neutral-600">
                        <p>Descripción del producto...</p>
                    </div>
                </div>

                <div class="pt-6 border-t border-neutral-200 space-y-4">
                    <h3 class="text-lg font-semibold text-neutral-800 text-center">Comunícate con nuestras asesoras:</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                        </a>
                        <a id="whatsapp-link-ana" href="#" target="_blank" rel="noopener noreferrer" class="bg-blue-500 text-white py-3 px-4 rounded-lg hover:bg-blue-600 transition-all duration-300 flex items-center justify-center text-base font-semibold shadow-md hover:shadow-lg hover:scale-105 group">
                            <!-- Content will be populated by JavaScript -->
