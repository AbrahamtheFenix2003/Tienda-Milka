<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Milka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <!-- TinyMCE Editor -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
    <!-- Chart.js para gráficos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <!-- Day.js para manejo de fechas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            opacity: 0; 
            transition: opacity 0.5s; 
            scroll-behavior: smooth; 
        }
        .modal { display: none; }
        .modal.active { display: flex; }
        .sidebar-collapsed {
            width: 4rem;
        }
        .sidebar-collapsed .sidebar-text {
            display: none;
        }
        .sidebar-collapsed .sidebar-icon {
            margin: 0 auto;
        }
        .content-expanded {
            margin-left: 4rem;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            .content-area {
                margin-left: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Mobile menu overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"></div>
    
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar fixed left-0 top-0 h-full w-64 bg-rose-500 text-white z-50 transition-all duration-300">
        <div class="p-4 border-b border-rose-600 flex items-center justify-between">
            <div class="flex items-center">
                <img src="logo.jpg" alt="Milka" class="w-8 h-8 rounded mr-2">
                <h2 class="sidebar-text text-xl font-bold">Admin Milka</h2>
            </div>
            <button id="sidebar-toggle" class="text-white hover:bg-rose-600 p-2 rounded">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>
        
        <nav class="mt-6">
            <ul>
                <li class="mb-2">
                    <a href="#" class="nav-link block py-3 px-4 hover:bg-rose-600 transition-colors" data-section="dashboard">
                        <i class="sidebar-icon fas fa-tachometer-alt mr-2"></i>
                        <span class="sidebar-text">Dashboard</span>
                    </a>
                </li>
                <li class="mb-2" id="nav-productos-li">
                    <a href="#" class="nav-link block py-3 px-4 hover:bg-rose-600 transition-colors" data-section="productos">
                        <i class="sidebar-icon fas fa-box mr-2"></i>
                        <span class="sidebar-text">Productos</span>
                    </a>
                </li>
                <li class="mb-2">
                    <a href="#" class="nav-link block py-3 px-4 hover:bg-rose-600 transition-colors" data-section="ventas">
                        <i class="sidebar-icon fas fa-shopping-cart mr-2"></i>
                        <span class="sidebar-text">Ventas</span>
                    </a>
                </li>
                <li class="mb-2" id="nav-reportes-li">
                    <a href="#" class="nav-link block py-3 px-4 hover:bg-rose-600 transition-colors" data-section="reportes">
                        <i class="sidebar-icon fas fa-chart-bar mr-2"></i>
                        <span class="sidebar-text">Reportes</span>
                    </a>
                </li>
                <li class="mb-2" id="nav-egresos-li">
                    <a href="#" class="nav-link block py-3 px-4 hover:bg-rose-600 transition-colors" data-section="egresos">
                        <i class="sidebar-icon fas fa-credit-card mr-2"></i>
                        <span class="sidebar-text">Egresos</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <div class="absolute bottom-0 w-full border-t border-rose-600 p-4">
            <a href="/" class="block py-2 text-center bg-white text-rose-500 rounded hover:bg-gray-100 transition-colors mb-2">
                <i class="fas fa-arrow-left mr-2"></i>
                <span class="sidebar-text">Tienda</span>
            </a>
            <button id="logout-btn" class="block w-full py-2 text-center bg-rose-600 text-white rounded hover:bg-rose-700 transition-colors">
                <i class="fas fa-sign-out-alt mr-2"></i>
                <span class="sidebar-text">Cerrar Sesión</span>
            </button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div id="content-wrapper" class="content-area ml-64 transition-all duration-300">
        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-30">
            <div class="px-6 py-4 flex justify-between items-center">
                <div class="flex items-center">
                    <button id="mobile-menu-toggle" class="md:hidden text-gray-600 hover:text-gray-800 mr-4">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 id="page-title" class="text-2xl font-bold text-gray-800">Dashboard</h1>
                </div>
                <div id="user-info" class="text-sm text-gray-600 flex items-center">
                    <i class="fas fa-user mr-2"></i>
                    <span>Cargando...</span>
                </div>
            </div>
        </header>
        
        <!-- Content Area -->
        <main id="content-area" class="p-6">
            <!-- El contenido específico de cada sección se cargará aquí -->
            <div class="text-center py-8">
                <i class="fas fa-spinner fa-spin text-4xl text-gray-400 mb-4"></i>
                <p class="text-gray-500">Cargando panel administrativo...</p>
            </div>
        </main>
    </div>

    <!-- Firebase Scripts (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-storage-compat.js"></script>
    
    <script>
        // Configuración de roles
        const SUPER_ADMIN_EMAILS = ['elinquisidor09@gmail.com', 'milkavv.2001@gmail.com'];
        const SUPER_VENDEDOR_EMAILS = ['garyvv.1993@gmail.com', 'abrahamjimenez092003@gmail.com'];
        const VENDEDOR_EMAILS = ['amvf280194@gmail.com', 'noeatlas28@gmail.com'];
        
        let auth, db, storage;
        let currentUser = null;
        let currentSection = 'dashboard';
        let productsCache = [];
        let categoriesCache = [];
        let allSales = [];
        let allExpenses = [];
        let salesChart, categoryChart;
        let saleItems = []; // Para el sistema de ventas
        let selectedProduct = null; // Para el sistema de ventas

        // Funciones para verificar roles
        function isSuperAdmin(email) {
            return SUPER_ADMIN_EMAILS.includes(email);
        }

        function isSuperVendedor(email) {
            return SUPER_VENDEDOR_EMAILS.includes(email);
        }

        function isVendedor(email) {
            return VENDEDOR_EMAILS.includes(email);
        }

        function isAdmin(email) {
            return isSuperAdmin(email) || isSuperVendedor(email);
        }

        function hasAccessToSales(email) {
            return isAdmin(email) || isVendedor(email);
        }

        async function initializeApp() {
            try {
                const response = await fetch('/__/firebase/init.json');
                const config = await response.json();
                firebase.initializeApp(config);
                
                auth = firebase.auth();
                db = firebase.firestore();
                storage = firebase.storage();
                
                setupAdminPanel();
            } catch (error) {
                console.error("Error al inicializar Firebase:", error);
                showError('Error de conexión. Por favor recarga la página.');
            }
        }

        function setupAdminPanel() {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    
                    // Verificar si tiene acceso administrativo
                    if (hasAccessToSales(user.email)) {
                        document.body.style.opacity = '1';
                        
                        // Configurar interfaz según rol
                        setupUserInterface(user.email);
                        
                        // Mostrar información del usuario
                        document.getElementById('user-info').innerHTML = `
                            <i class="fas fa-user mr-2"></i>
                            <span>${user.email}</span>
                        `;
                        
                        // Configurar eventos
                        setupEventListeners();
                        
                        // Cargar datos iniciales
                        await loadInitialData();
                        
                        // Cargar la sección por defecto
                        loadSection('dashboard');
                        
                    } else {
                        showError('No tienes permisos de administrador');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    }
                } else {
                    window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                }
            });
        }

        function setupUserInterface(userEmail) {
            // Configurar navegación según el rol del usuario
            if (isVendedor(userEmail)) {
                // Ocultar opciones de gestión de productos para vendedores simples
                document.getElementById('nav-productos-li').style.display = 'none';
                // Los vendedores pueden ver reportes limitados
                document.getElementById('nav-reportes-li').style.display = 'block';
                // Ocultar egresos para vendedores simples
                document.getElementById('nav-egresos-li').style.display = 'none';
            } else if (isSuperVendedor(userEmail)) {
                // Los super vendedores pueden ver productos pero no editarlos
                document.getElementById('nav-productos-li').style.display = 'block';
                document.getElementById('nav-reportes-li').style.display = 'block';
                document.getElementById('nav-egresos-li').style.display = 'block';
            } else if (isSuperAdmin(userEmail)) {
                // Los super admins tienen acceso completo
                document.getElementById('nav-productos-li').style.display = 'block';
                document.getElementById('nav-reportes-li').style.display = 'block';
                document.getElementById('nav-egresos-li').style.display = 'block';
            }
        }

        function setupEventListeners() {
            // Navegación del sidebar
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const section = this.dataset.section;
                    loadSection(section);
                });
            });

            // Toggle del sidebar
            document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
            
            // Menú móvil
            document.getElementById('mobile-menu-toggle').addEventListener('click', toggleMobileMenu);
            document.getElementById('mobile-overlay').addEventListener('click', closeMobileMenu);

            // Logout
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.signOut().then(() => {
                    window.location.href = '/';
                }).catch(error => {
                    console.error('Error al cerrar sesión:', error);
                });
            });

            // Configurar navegación de botones del navegador
            window.addEventListener('popstate', function() {
                const hash = window.location.hash.replace('#', '') || 'dashboard';
                loadSection(hash);
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const contentWrapper = document.getElementById('content-wrapper');
            const toggleIcon = document.querySelector('#sidebar-toggle i');
            
            sidebar.classList.toggle('sidebar-collapsed');
            
            if (sidebar.classList.contains('sidebar-collapsed')) {
                contentWrapper.classList.add('content-expanded');
                contentWrapper.style.marginLeft = '4rem';
                toggleIcon.className = 'fas fa-chevron-right';
            } else {
                contentWrapper.classList.remove('content-expanded');
                contentWrapper.style.marginLeft = '16rem';
                toggleIcon.className = 'fas fa-chevron-left';
            }
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('hidden');
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            sidebar.classList.remove('mobile-open');
            overlay.classList.add('hidden');
        }

        async function loadInitialData() {
            try {
                // Cargar productos siempre (para ventas)
                await loadProducts();
                
                // Cargar categorías si tiene acceso a gestión de productos
                if (isAdmin(currentUser.email)) {
                    await loadCategories();
                }
                
                // Cargar ventas
                await loadSales();
                
                // Cargar egresos solo para admins
                if (isAdmin(currentUser.email)) {
                    await loadExpenses();
                }
                
                console.log('Datos iniciales cargados correctamente');
            } catch (error) {
                console.error('Error cargando datos iniciales:', error);
                showError('Error cargando algunos datos. Algunas funciones pueden no estar disponibles.');
            }
        }

        async function loadProducts() {
            try {
                const querySnapshot = await db.collection("products").get();
                productsCache = [];
                querySnapshot.forEach((doc) => {
                    productsCache.push({ id: doc.id, ...doc.data() });
                });
                productsCache.sort((a, b) => a.name.localeCompare(b.name));
                console.log(`Cargados ${productsCache.length} productos`);
            } catch (error) {
                console.error("Error cargando productos:", error);
            }
        }

        async function loadCategories() {
            try {
                const querySnapshot = await db.collection("categories").get();
                categoriesCache = [];
                querySnapshot.forEach((doc) => {
                    categoriesCache.push({ id: doc.id, ...doc.data() });
                });
                categoriesCache.sort((a, b) => a.name.localeCompare(b.name));
                console.log(`Cargadas ${categoriesCache.length} categorías`);
            } catch (error) {
                console.error("Error cargando categorías:", error);
            }
        }

        async function loadSales() {
            try {
                const querySnapshot = await db.collection("sales").get();
                allSales = [];
                querySnapshot.forEach((doc) => {
                    allSales.push({ id: doc.id, ...doc.data() });
                });
                
                // Ordenar por fecha
                allSales.sort((a, b) => {
                    const getTimestamp = (sale) => {
                        if (sale.timestamp && sale.timestamp.toDate) {
                            return sale.timestamp.toDate().getTime();
                        } else if (sale.timestamp) {
                            return new Date(sale.timestamp).getTime();
                        } else if (sale.date) {
                            return new Date(sale.date).getTime();
                        }
                        return 0;
                    };
                    return getTimestamp(b) - getTimestamp(a);
                });
                
                console.log(`Cargadas ${allSales.length} ventas`);
            } catch (error) {
                console.error("Error cargando ventas:", error);
            }
        }

        async function loadExpenses() {
            try {
                const querySnapshot = await db.collection("expenses").get();
                allExpenses = [];
                querySnapshot.forEach((doc) => {
                    allExpenses.push({ id: doc.id, ...doc.data() });
                });
                
                // Ordenar por fecha
                allExpenses.sort((a, b) => {
                    const getTimestamp = (expense) => {
                        if (expense.timestamp && expense.timestamp.toDate) {
                            return expense.timestamp.toDate().getTime();
                        } else if (expense.timestamp) {
                            return new Date(expense.timestamp).getTime();
                        } else if (expense.date) {
                            return new Date(expense.date).getTime();
                        }
                        return 0;
                    };
                    return getTimestamp(b) - getTimestamp(a);
                });
                
                console.log(`Cargados ${allExpenses.length} egresos`);
            } catch (error) {
                console.error("Error cargando egresos:", error);
            }
        }

        function loadSection(section) {
            currentSection = section;
            
            // Actualizar navegación activa
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-rose-600');
                if (link.dataset.section === section) {
                    link.classList.add('bg-rose-600');
                }
            });
            
            // Actualizar título
            const titles = {
                'dashboard': 'Dashboard',
                'productos': 'Gestión de Productos',
                'ventas': 'Registro de Ventas',
                'reportes': 'Reportes',
                'egresos': 'Gestión de Egresos'
            };
            
            document.getElementById('page-title').textContent = titles[section] || 'Panel Admin';
            
            // Cargar contenido de la sección
            switch(section) {
                case 'dashboard':
                    if (typeof loadDashboard === 'function') {
                        loadDashboard();
                    } else {
                        showLoading('Cargando Dashboard...');
                    }
                    break;
                case 'productos':
                    if (typeof loadProductos === 'function') {
                        loadProductos();
                    } else {
                        showLoading('Cargando Productos...');
                    }
                    break;
                case 'ventas':
                    if (typeof loadVentas === 'function') {
                        loadVentas();
                    } else {
                        showLoading('Cargando Ventas...');
                    }
                    break;
                case 'reportes':
                    if (typeof loadReportes === 'function') {
                        loadReportes();
                    } else {
                        showLoading('Cargando Reportes...');
                    }
                    break;
                case 'egresos':
                    if (typeof loadEgresos === 'function') {
                        loadEgresos();
                    } else {
                        showLoading('Cargando Egresos...');
                    }
                    break;
                default:
                    if (typeof loadDashboard === 'function') {
                        loadDashboard();
                    } else {
                        showLoading('Cargando Dashboard...');
                    }
            }
            
            // Cerrar menú móvil si está abierto
            closeMobileMenu();
        }

        function showError(message) {
            document.getElementById('content-area').innerHTML = `
                <div class="text-center py-8">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                    <p class="text-red-600 text-lg font-semibold">${message}</p>
                </div>
            `;
        }

        function showLoading(message = 'Cargando...') {
            document.getElementById('content-area').innerHTML = `
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-4xl text-gray-400 mb-4"></i>
                    <p class="text-gray-500">${message}</p>
                </div>
            `;
        }

        // Inicializar la aplicación cuando se carga el DOM
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
    
    <!-- Scripts para las secciones individuales -->
    <script src="js/admin-dashboard.js"></script>
    <script src="js/admin-productos.js"></script>
    <script src="js/admin-ventas.js"></script>
    <script src="js/admin-reportes.js"></script>
    <script src="js/admin-egresos.js"></script>
</body>
</html>
