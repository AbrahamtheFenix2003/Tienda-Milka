<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Milka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <!-- TinyMCE Editor -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
    <!-- Chart.js para gráficos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <!-- Day.js para manejo de fechas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>
    <!-- jsPDF para exportar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        // Asegurar compatibilidad global de jsPDF
        if (typeof window.jsPDF === 'undefined' && typeof jsPDF !== 'undefined') {
            window.jsPDF = jsPDF;
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            opacity: 0; 
            transition: opacity 0.5s; 
            scroll-behavior: smooth; 
        }
        .modal { 
            display: none !important; 
            z-index: 9999;
        }
        .modal.active { 
            display: flex !important; 
        }
        
        /* Mejorar la visualización de modales */
        .modal .bg-white {
            position: relative;
            z-index: 10000;
        }
        
        /* Asegurar que los botones de cierre sean clickeables */
        .modal button[id*="close-"],
        .modal button[id*="cancel-"] {
            cursor: pointer;
            z-index: 10001;
        }
        
        .modal button[id*="close-"]:hover,
        .modal button[id*="cancel-"]:hover {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        
        #sidebar {
            width: 16rem;
            transition: width 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            overflow: hidden;
        }
        
        .sidebar-collapsed {
            width: 4rem !important;
        }
        
        /* Estilo para el header del sidebar */
        .sidebar-header {
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .sidebar-collapsed .sidebar-header {
            text-align: center;
        }
        
        /* Texto del sidebar */
        .sidebar-text {
            display: inline-block;
            white-space: nowrap;
            transition: opacity 0.15s ease, transform 0.15s ease;
            opacity: 1;
            transform: translateX(0);
        }
        
        .sidebar-collapsed .sidebar-text {
            opacity: 0 !important;
            transform: translateX(-20px) !important;
            pointer-events: none;
        }
        
        /* Logo text */
        .sidebar-logo-text {
            transition: opacity 0.15s ease, transform 0.15s ease;
            opacity: 1;
            transform: translateX(0);
        }
        
        .sidebar-collapsed .sidebar-logo-text {
            opacity: 0 !important;
            transform: translateX(-20px) !important;
        }
        
        /* Iconos del sidebar */
        .sidebar-icon {
            display: inline-block;
            width: 1.25rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .sidebar-collapsed .sidebar-icon {
            margin-right: 0 !important;
        }
        
        /* Links del sidebar */
        .nav-link {
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .sidebar-collapsed .nav-link {
            justify-content: center;
            padding-left: 0.75rem !important;
            padding-right: 0.75rem !important;
        }
        
        /* Botón de toggle mejorado */
        #sidebar-toggle {
            transition: all 0.3s ease;
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sidebar-collapsed #sidebar-toggle {
            margin: 0 auto;
        }
        
        /* Content wrapper */
        #content-wrapper {
            margin-left: 16rem;
            transition: margin-left 0.3s ease;
        }
        
        .content-expanded {
            margin-left: 4rem !important;
        }
        
        /* Botones del footer */
        .sidebar-footer-btn {
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .sidebar-collapsed .sidebar-footer-btn {
            padding-left: 0.5rem !important;
            padding-right: 0.5rem !important;
            text-align: center;
        }
        
        /* Scroll en el sidebar */
        .sidebar-nav {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        /* Estilo del scrollbar */
        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        
        .sidebar-nav::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }
        
        .sidebar-nav::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        /* Ocultar completamente el scrollbar cuando esté colapsado */
        .sidebar-collapsed .sidebar-nav {
            overflow-x: visible;
        }
        
        .sidebar-collapsed .sidebar-nav::-webkit-scrollbar {
            display: none;
        }
        
        /* Asegurar que no se vea nada de texto cuando esté colapsado */
        .sidebar-collapsed * {
            overflow: hidden !important;
        }
        
        .sidebar-collapsed .sidebar-text {
            display: none !important;
        }
        
        .sidebar-collapsed .sidebar-logo-text {
            display: none !important;
        }
        
        /* Centrar perfectamente los iconos cuando esté colapsado */
        .sidebar-collapsed .nav-link {
            justify-content: center !important;
            padding: 0.75rem !important;
        }
        
        .sidebar-collapsed .sidebar-icon {
            margin: 0 !important;
        }
        
        /* Tooltip para mostrar el nombre cuando esté colapsado */
        .sidebar-collapsed .nav-link {
            position: relative;
        }
        
        .sidebar-collapsed .nav-link:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            margin-left: 0.5rem;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            white-space: nowrap;
            z-index: 1000;
            pointer-events: none;
        }
        
        /* Estilos para filtros */
        .filtros-container {
            transition: all 0.3s ease;
        }
        
        .filtros-container.collapsed {
            max-height: 0;
            overflow: hidden;
            padding: 0;
            margin: 0;
            opacity: 0;
        }
        
        /* Indicadores de stock mejorados */
        .stock-zero {
            background-color: rgba(239, 68, 68, 0.1);
            color: rgb(185, 28, 28);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .stock-low {
            background-color: rgba(245, 158, 11, 0.1);
            color: rgb(180, 83, 9);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        
        .stock-ok {
            background-color: rgba(16, 185, 129, 0.1);
            color: rgb(4, 120, 87);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        /* Efectos hover para productos */
        .product-card:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease;
        }
        
        /* Responsive para filtros */
        @media (max-width: 1024px) {
            .filtros-container .flex {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filtros-container .flex > div {
                width: 100%;
                margin-bottom: 0.5rem;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            .content-area {
                margin-left: 0 !important;
            }
        }
        @media (min-width: 769px) {
            .sidebar {
                transform: translateX(0);
            }
            .content-area {
                margin-left: 16rem;
            }
        }
    </style>
</head>

    <!-- Firebase Scripts (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-storage-compat.js"></script>
    
    <script type="module">
        import { loadDashboardPage } from './js/admin/pages/dashboard/index.js';
        import { loadReportesPage } from './js/admin/pages/reportes/index.js';
        import { loadProductosPage } from './js/admin/pages/productos/index.js';
        import { loadVentasPage } from './js/admin/pages/ventas/index.js';
        import { loadCajaPage } from './js/admin/pages/caja/index.js';

        // Configuración de roles
        const SUPER_ADMIN_EMAILS = ['elinquisidor09@gmail.com', 'milkavv.2001@gmail.com'];
        const SUPER_VENDEDOR_EMAILS = ['garyvv.1993@gmail.com', 'abrahamjimenez092003@gmail.com'];
        const VENDEDOR_EMAILS = ['amvf280194@gmail.com', 'noeatlas28@gmail.com'];
        
        let auth, db, storage;
        let currentUser = null;
        let currentSection = 'dashboard';
        let productsCache = [];
        let categoriesCache = [];
        let allSales = [];
        let salesChart, categoryChart;
        // Variables para ventas movidas a archivo específico

        // Funciones para verificar roles
        function isSuperAdmin(email) {
            return SUPER_ADMIN_EMAILS.includes(email);
        }

        function isSuperVendedor(email) {
            return SUPER_VENDEDOR_EMAILS.includes(email);
        }

        function isVendedor(email) {
            return VENDEDOR_EMAILS.includes(email);
        }

        function isAdmin(email) {
            return isSuperAdmin(email) || isSuperVendedor(email);
        }

        function hasAccessToSales(email) {
            return isAdmin(email) || isVendedor(email);
        }

        // Hacer funciones disponibles globalmente
        window.isSuperAdmin = isSuperAdmin;
        window.isSuperVendedor = isSuperVendedor;
        window.isVendedor = isVendedor;
        window.isAdmin = isAdmin;
        window.hasAccessToSales = hasAccessToSales;

        async function initializeApp() {
            try {
                const response = await fetch('/__/firebase/init.json');
                const config = await response.json();
                firebase.initializeApp(config);
                
                auth = firebase.auth();
                db = firebase.firestore();
                storage = firebase.storage();
                
                // Hacer variables disponibles globalmente
                window.auth = auth;
                window.db = db;
                window.storage = storage;
                window.currentUser = null;
                window.productsCache = [];
                window.categoriesCache = [];
                window.proveedoresCache = [];
                window.allSales = [];
                window.allExpenses = [];
                
                setupAdminPanel();
                
                // Registrar el Service Worker "kamikaze"
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/sw.js')
                        .then(reg => console.log('SW kamikaze registrado:', reg))
                        .catch(err => console.error('Error registrando SW kamikaze:', err));
                }
            } catch (error) {
                console.error("Error al inicializar Firebase:", error);
                showError('Error de conexión. Por favor recarga la página.');
            }
        }

        function setupAdminPanel() {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    window.currentUser = user;
                    
                    // Verificar si tiene acceso administrativo
                    if (hasAccessToSales(user.email)) {
                        document.body.style.opacity = '1';
                        
                        // Configurar interfaz según rol
                        setupUserInterface(user.email);
                        
                        // Mostrar información del usuario
                        document.getElementById('user-info').innerHTML = `
                            <i class="fas fa-user mr-2"></i>
                            <span>${user.email}</span>
                        `;
                        
                        // Configurar eventos
                        setupEventListeners();
                        
                        // Cargar datos iniciales
                        await loadInitialData();
                        
                        // Cargar la sección por defecto o la especificada en el hash
                        const initialSection = window.location.hash.replace('#', '') || 'dashboard';
                        loadSection(initialSection);
                        
                    } else {
                        showError('No tienes permisos de administrador');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    }
                } else {
                    window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                }
            });
        }

        function setupUserInterface(userEmail) {
            // Configurar navegación según el rol del usuario
            if (isVendedor(userEmail)) {
                // Los vendedores pueden ver dashboard y ventas
                // Mantener dashboard y ventas visibles (están por defecto)
                
                // Ocultar opciones de gestión de productos para vendedores simples
                document.getElementById('nav-productos-li').style.display = 'none';
                // Ocultar reportes para vendedores simples
                document.getElementById('nav-reportes-li').style.display = 'none';
                // Ocultar análisis de rentabilidad para vendedores simples
                document.getElementById('nav-rentabilidad-li').style.display = 'none';
                // Ocultar egresos para vendedores simples
                // Ocultar nuevos módulos para vendedores simples
                document.getElementById('nav-almacen-li').style.display = 'none';
                document.getElementById('nav-compras-li').style.display = 'none';
                document.getElementById('nav-caja-li').style.display = 'none';
            } else if (isSuperVendedor(userEmail)) {
                // Los super vendedores pueden ver productos pero no editarlos
                document.getElementById('nav-productos-li').style.display = 'block';
                document.getElementById('nav-reportes-li').style.display = 'block';
                document.getElementById('nav-rentabilidad-li').style.display = 'block';
                document.getElementById('nav-almacen-li').style.display = 'block';
                document.getElementById('nav-compras-li').style.display = 'block';
                document.getElementById('nav-caja-li').style.display = 'block';
            } else if (isSuperAdmin(userEmail)) {
                // Los super admins tienen acceso completo
                document.getElementById('nav-productos-li').style.display = 'block';
                document.getElementById('nav-reportes-li').style.display = 'block';
                document.getElementById('nav-rentabilidad-li').style.display = 'block';
                document.getElementById('nav-almacen-li').style.display = 'block';
                document.getElementById('nav-compras-li').style.display = 'block';
                document.getElementById('nav-caja-li').style.display = 'block';
            }
        }

        function setupEventListeners() {
            // Navegación del sidebar
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    const section = this.dataset.section;
                    if (section) {
                        e.preventDefault();
                        loadSection(section);
                    }
                    // Si no tiene data-section, se comporta como enlace normal
                });
            });

            // Toggle del sidebar
            document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
            
            // Menú móvil
            document.getElementById('mobile-menu-toggle').addEventListener('click', toggleMobileMenu);
            document.getElementById('mobile-overlay').addEventListener('click', closeMobileMenu);

            // Logout
            document.getElementById('logout-btn').addEventListener('click', () => {
                auth.signOut().then(() => {
                    window.location.href = '/login.html';
                }).catch(error => {
                    console.error('Error al cerrar sesión:', error);
                });
            });

            // Configurar navegación de botones del navegador
            window.addEventListener('popstate', function() {
                const hash = window.location.hash.replace('#', '') || 'dashboard';
                loadSection(hash);
            });
        }

        // Función global para cerrar modales con Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const activeModal = document.querySelector('.modal.active');
                if (activeModal) {
                    activeModal.classList.remove('active');
                }
            }
        });

        // Función global para cerrar todos los modales
        window.closeAllModals = function() {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                modal.classList.remove('active');
            });
        };

        // Función de emergencia para limpiar modales problemáticos
        window.emergencyCloseModals = function() {
            // Remover todas las clases 'active' de todos los modales
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.remove('active');
                modal.style.display = 'none';
            });
            
            // Forzar ocultación con setTimeout
            setTimeout(() => {
                document.querySelectorAll('.modal').forEach(modal => {
                    modal.classList.remove('active');
                    modal.style.display = 'none';
                });
            }, 100);
        };

        // Ejecutar limpieza al cambiar de sección
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('nav-link')) {
                setTimeout(() => {
                    window.emergencyCloseModals();
                }, 500);
            }
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const contentWrapper = document.getElementById('content-wrapper');
            const toggleIcon = document.querySelector('#sidebar-toggle i');
            
            sidebar.classList.toggle('sidebar-collapsed');
            
            if (sidebar.classList.contains('sidebar-collapsed')) {
                contentWrapper.classList.add('content-expanded');
                toggleIcon.className = 'fas fa-chevron-right';
            } else {
                contentWrapper.classList.remove('content-expanded');
                toggleIcon.className = 'fas fa-chevron-left';
            }
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('hidden');
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            sidebar.classList.remove('mobile-open');
            overlay.classList.add('hidden');
        }

        async function loadInitialData() {
            try {
                // Cargar productos siempre (para ventas)
                await loadProducts();
                
                // Cargar categorías si tiene acceso a gestión de productos
                if (isAdmin(currentUser.email)) {
                    await loadCategories();
                    // Cargar proveedores para gestión de compras
                    await loadProveedores();
                }
                
                // Cargar ventas
                await loadSales();
                
                
                console.log('Datos iniciales cargados correctamente');
            } catch (error) {
                console.error('Error cargando datos iniciales:', error);
                showError('Error cargando algunos datos. Algunas funciones pueden no estar disponibles.');
            }
        }

        async function loadProducts() {
            try {
                const querySnapshot = await db.collection("products").get();
                productsCache = [];
                querySnapshot.forEach((doc) => {
                    productsCache.push({ id: doc.id, ...doc.data() });
                });
                productsCache.sort((a, b) => a.name.localeCompare(b.name));
                window.productsCache = productsCache;
                console.log(`Cargados ${productsCache.length} productos`);
            } catch (error) {
                console.error("Error cargando productos:", error);
            }
        }

        async function loadCategories() {
            try {
                const querySnapshot = await db.collection("categories").get();
                categoriesCache = [];
                querySnapshot.forEach((doc) => {
                    categoriesCache.push({ id: doc.id, ...doc.data() });
                });
                categoriesCache.sort((a, b) => a.name.localeCompare(b.name));
                window.categoriesCache = categoriesCache;
                console.log(`Cargadas ${categoriesCache.length} categorías`);
            } catch (error) {
                console.error("Error cargando categorías:", error);
            }
        }

        async function loadProveedores() {
            try {
                const querySnapshot = await db.collection("proveedores").get();
                proveedoresCache = [];
                querySnapshot.forEach((doc) => {
                    proveedoresCache.push({ id: doc.id, ...doc.data() });
                });
                proveedoresCache.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
                window.proveedoresCache = proveedoresCache;
                console.log(`Cargados ${proveedoresCache.length} proveedores`);
                
                // Disparar evento para notificar que los proveedores están cargados
                window.dispatchEvent(new CustomEvent('proveedoresLoaded', { 
                    detail: { proveedores: proveedoresCache } 
                }));
                
            } catch (error) {
                console.error("Error cargando proveedores:", error);
                window.proveedoresCache = [];
            }
        }

        async function loadSales() {
            try {
                const querySnapshot = await db.collection("sales").get();
                allSales = [];
                querySnapshot.forEach((doc) => {
                    allSales.push({ id: doc.id, ...doc.data() });
                });
                
                // Ordenar por fecha
                allSales.sort((a, b) => {
                    const getTimestamp = (sale) => {
                        // Prioridad: timestamp (nuevo) -> soldAt (antiguo) -> date -> 0
                        if (sale.timestamp && sale.timestamp.toDate) {
                            return sale.timestamp.toDate().getTime();
                        } else if (sale.timestamp) {
                            return new Date(sale.timestamp).getTime();
                        } else if (sale.soldAt && sale.soldAt.toDate) {
                            return sale.soldAt.toDate().getTime();
                        } else if (sale.soldAt) {
                            return new Date(sale.soldAt).getTime();
                        } else if (sale.date) {
                            return new Date(sale.date).getTime();
                        }
                        return 0;
                    };
                    return getTimestamp(b) - getTimestamp(a);
                });
                
                window.allSales = allSales;
                console.log(`Cargadas ${allSales.length} ventas`);
            } catch (error) {
                console.error("Error cargando ventas:", error);
            }
        }


        // Hacer funciones de carga disponibles globalmente
        window.loadProducts = loadProducts;
        window.loadCategories = loadCategories;
        window.loadProveedores = loadProveedores;
        window.loadSales = loadSales;

        // Funciones helper de Firebase para los archivos JS
        window.addDoc = (collection, data) => collection.add(data);
        window.updateDoc = (docRef, data) => docRef.update(data);
        window.deleteDoc = (docRef) => docRef.delete();
        window.doc = (db, collection, id) => db.collection(collection).doc(id);
        window.collection = (db, name) => db.collection(name);
        window.serverTimestamp = firebase.firestore.FieldValue.serverTimestamp;
        window.runTransaction = (db, updateFunction) => db.runTransaction(updateFunction);

        async function loadSection(section) {
            currentSection = section;
            
            // Actualizar el hash en la URL
            if (window.location.hash !== `#${section}`) {
                window.history.pushState(null, null, `#${section}`);
            }
            
            // Actualizar navegación activa
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-rose-600');
                if (link.dataset.section === section) {
                    link.classList.add('bg-rose-600');
                }
            });
            
            // Actualizar título
            const titles = {
                'dashboard': 'Dashboard',
                'productos': 'Gestión de Productos',
                'ventas': 'Registro de Ventas',
                'reportes': 'Reportes',
                'rentabilidad': 'Análisis de Rentabilidad',
                'almacen': 'Gestión de Almacén',
                'compras': 'Gestión de Compras',
                'caja': 'Gestión de Caja',
            };
            
            document.getElementById('page-title').textContent = titles[section] || 'Panel Admin';
            
            // Cargar contenido de la sección
            switch(section) {
                case 'dashboard':
                    showLoading('Cargando Dashboard...');
                    try {
                        console.log('Cargando dashboard...');
                        await loadDashboardPage();
                    } catch (error) {
                        console.error('Error cargando dashboard:', error);
                        showError('Error: No se pudo cargar el dashboard');
                    }
                    break;
                case 'productos':
                    try {
                        console.log('Cargando productos...');
                        await loadProductosPage();
                    } catch (error) {
                        console.error('Error cargando productos:', error);
                        showError('Error: No se pudo cargar la gestión de productos');
                    }
                    break;
                case 'ventas':
                    showLoading('Cargando Ventas...');
                    try {
                        console.log('Cargando ventas...');
                        await loadVentasPage();
                    } catch (error) {
                        console.error('Error al cargar ventas:', error);
                        showError('Error: No se pudo cargar el registro de ventas');
                    }
                    break;
                case 'reportes':
                    try {
                        console.log('Cargando reportes...');
                        await loadReportesPage();
                    } catch (error) {
                        console.error('Error cargando reportes:', error);
                        showError('Error: No se pudo cargar los reportes');
                    }
                    break;
                case 'rentabilidad':
                    if (typeof loadRentabilidad === 'function') {
                        console.log('Cargando análisis de rentabilidad...');
                        loadRentabilidad();
                    } else {
                        console.log('loadRentabilidad no está disponible');
                        showLoading('Cargando Análisis de Rentabilidad...');
                        setTimeout(() => {
                            if (typeof loadRentabilidad === 'function') {
                                loadRentabilidad();
                            } else {
                                showError('Error: No se pudo cargar el análisis de rentabilidad');
                            }
                        }, 1000);
                    }
                    break;
                case 'almacen':
                    if (typeof loadAlmacen === 'function') {
                        console.log('Cargando almacén...');
                        loadAlmacen();
                    } else {
                        console.log('loadAlmacen no está disponible');
                        showLoading('Cargando Almacén...');
                        setTimeout(() => {
                            if (typeof loadAlmacen === 'function') {
                                loadAlmacen();
                            } else {
                                showError('Error: No se pudo cargar la gestión de almacén');
                            }
                        }, 1000);
                    }
                    break;
                case 'compras':
                    if (typeof loadCompras === 'function') {
                        console.log('Cargando compras...');
                        loadCompras();
                    } else {
                        console.log('loadCompras no está disponible');
                        showLoading('Cargando Compras...');
                        setTimeout(() => {
                            if (typeof loadCompras === 'function') {
                                loadCompras();
                            } else {
                                showError('Error: No se pudo cargar la gestión de compras');
                            }
                        }, 1000);
                    }
                    break;
                case 'caja':
                    showLoading('Cargando Caja...');
                    try {
                        console.log('Cargando caja (modulo)...');
                        await loadCajaPage();
                    } catch (error) {
                        console.error('Error cargando caja:', error);
                        showError('Error: No se pudo cargar la gestion de caja');
                    }
                    break;
                default:
                    showLoading('Cargando Dashboard...');
                    try {
                        await loadDashboardPage();
                    } catch (error) {
                        console.error('Error cargando dashboard:', error);
                        showError('Error: No se pudo cargar el dashboard');
                    }
            }
            
            // Cerrar menú móvil si está abierto
            closeMobileMenu();
        }

        function showError(message) {
            document.getElementById('content-area').innerHTML = `
                <div class="text-center py-8">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                    <p class="text-red-600 text-lg font-semibold">${message}</p>

            `;
        }

        function showLoading(message = 'Cargando...') {
            document.getElementById('content-area').innerHTML = `
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-4xl text-gray-400 mb-4"></i>
                    <p class="text-gray-500">${message}</p>
                </div>
            `;
        }

        // Inicializar la aplicación cuando se carga el DOM
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM cargado, iniciando aplicación...');
            initializeApp();
        });

            console.log('loadReportesPage:', typeof loadReportesPage);
            console.log('loadRentabilidad:', typeof loadRentabilidad);
            console.log('loadAlmacen:', typeof loadAlmacen);
            console.log('loadCompras:', typeof loadCompras);
            console.log('loadCajaPage:', typeof loadCajaPage);
        });
    </script>
