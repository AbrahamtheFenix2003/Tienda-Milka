<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <!-- TinyMCE Editor -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; opacity: 0; transition: opacity 0.5s; scroll-behavior: smooth; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:p-8 flex justify-between items-center h-16">
            <div class="flex items-center space-x-4">
                <div class="flex space-x-1">
                    <button id="back-button" title="Atrás" class="p-2 rounded-full hover:bg-gray-200 transition-colors">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button id="forward-button" title="Adelante" class="p-2 rounded-full hover:bg-gray-200 transition-colors">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                <h1 class="text-xl font-bold text-gray-800">Gestión de Productos</h1>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/reportes.html" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors">
                    Ver Reportes
                </a>
                <button id="logout-button" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div class="mb-6 flex space-x-4">
            <button id="show-all-products" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 font-medium active">Todos los productos</button>
            <button id="show-no-stock" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 font-medium">Sin stock (0)</button>
        </div>
        <div id="form-section" class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 id="form-title" class="text-2xl font-bold mb-4">Añadir Nuevo Producto</h2>
            <form id="product-form" class="space-y-6">
                <input type="hidden" id="productId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Nombre del Producto</label>
                        <input type="text" id="name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                    </div>
                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700">Categoría</label>
                        <div class="flex items-center space-x-2 mt-1">
                            <select id="category" class="block w-full rounded-md border-gray-300 shadow-sm" required>
                                <option value="">Cargando...</option>
                            </select>
                            <button type="button" id="manage-categories-button" class="flex-shrink-0 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded">Gestionar</button>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="price" class="block text-sm font-medium text-gray-700">Precio de Venta (S/)</label>
                        <input type="number" step="0.01" id="price" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                    </div>
                    <div>
                        <label for="originalPrice" class="block text-sm font-medium text-gray-700">Precio Original (S/)</label>
                        <input type="number" step="0.01" id="originalPrice" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="acquisitionCost" class="block text-sm font-medium text-gray-700">Costo de Adquisición (S/)</label>
                        <input type="number" step="0.01" id="acquisitionCost" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                    </div>
                    <div>
                        <label for="stock" class="block text-sm font-medium text-gray-700">Stock (Unidades)</label>
                        <input type="number" id="stock" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="code" class="block text-sm font-medium text-gray-700">Código (SKU)</label>
                        <input type="text" id="code" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                    <div>
                        <label for="image" class="block text-sm font-medium text-gray-700">Imagen Principal</label>
                        <input type="file" id="image" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
                        <progress id="upload-progress" value="0" max="100" class="w-full mt-2 hidden"></progress>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label for="image2" class="block text-sm font-medium text-gray-700">Imagen 2</label>
                        <input type="file" id="image2" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
                    </div>
                    <div>
                        <label for="image3" class="block text-sm font-medium text-gray-700">Imagen 3</label>
                        <input type="file" id="image3" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
                    </div>
                    <div>
                        <label for="image4" class="block text-sm font-medium text-gray-700">Imagen 4</label>
                        <input type="file" id="image4" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
                    </div>
                </div>
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Descripción</label>
                    <textarea id="description" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-edit-button" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded hidden">Cancelar</button>
                    <button type="submit" id="submit-button" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-6 rounded">Guardar Producto</button>
                </div>
            </form>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold">Productos Existentes</h2>
                        <!-- Barra de búsqueda -->
                        <div class="w-1/3">
                            <input 
                                type="text" 
                                id="search-products" 
                                placeholder="Buscar por nombre o categoría..." 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                            >
                        </div>
                    </div>
                    <div id="products-list" class="space-y-4">
                        <p>Cargando productos...</p>
                    </div>
                </div>
    </main>

    <div id="category-modal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Gestionar Categorías</h3>
            <div class="flex space-x-2 mb-4">
                <input type="text" id="new-category-name" placeholder="Nombre de la nueva categoría" class="flex-grow block w-full rounded-md border-gray-300 shadow-sm">
                <button id="add-category-button" class="bg-rose-500 text-white font-bold py-2 px-4 rounded">Añadir</button>
            </div>
            <div id="modal-category-list" class="space-y-2 max-h-60 overflow-y-auto border-t pt-4"></div>
            <div class="text-right mt-6">
                <button id="close-modal-button" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initFirebase, setupNavigation, registerServiceWorker } from "./js/common.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // ✨ CAMBIO 1: Importamos 'onSnapshot' y 'query' para escuchar en tiempo real ✨
        import { getFirestore, collection, addDoc, getDoc, deleteDoc, doc, updateDoc, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const SUPER_ADMIN_EMAILS = ['elinquisidor09@gmail.com', 'milkavv.2001@gmail.com'];
        const SUPER_VENDEDOR_EMAILS = ['garyvv.1993@gmail.com', 'abrahamjimenez092003@gmail.com'];
        const VENDEDOR_EMAILS = ['amvf280194@gmail.com', 'noeatlas28@gmail.com'];
        let auth, db, storage, categoriesCache = [];

        // Funciones para verificar roles
        function isSuperAdmin(email) {
            return SUPER_ADMIN_EMAILS.includes(email);
        }

        function isSuperVendedor(email) {
            return SUPER_VENDEDOR_EMAILS.includes(email);
        }

        function isVendedor(email) {
            return VENDEDOR_EMAILS.includes(email);
        }

        function isAdmin(email) {
            return isSuperAdmin(email) || isSuperVendedor(email);
        }

        async function main() {
            try {
                const app = await initFirebase();
                auth = getAuth(app);
                db = getFirestore(app);
                storage = getStorage(app);
                setupAdminPage();
                registerServiceWorker();
            } catch (error) {
                console.error("Error al inicializar Firebase:", error);
            }
        }

        function setupAdminPage() {
            onAuthStateChanged(auth, (user) => {
                if (user && isAdmin(user.email)) {
                    document.body.style.opacity = '1';
                    
                    // Personalizar interfaz según el tipo de admin
                    if (isSuperVendedor(user.email)) {
                        // Ocultar secciones de gestión de productos para super vendedor
                        hideProductManagementSections();
                        
                        // Cambiar título del panel
                        const titleElement = document.querySelector('h1');
                        if (titleElement) {
                            titleElement.textContent = 'Panel de Ventas y Reportes';
                        }
                    }
                    
                    setupEventListeners();
                    // ✨ CAMBIO 2: Ya no cargamos los productos aquí, el listener se encargará ✨
                    loadCategories();
                } else {
                    window.location.href = '/index.html';
                }
            });
        }

        function hideProductManagementSections() {
            // Ocultar el formulario de productos
            const formSection = document.getElementById('form-section');
            if (formSection) {
                formSection.style.display = 'none';
            }
            
            // Ocultar los botones de filtro de productos
            const filterButtons = document.querySelector('.mb-6');
            if (filterButtons) {
                filterButtons.style.display = 'none';
            }
            
            // Crear mensaje informativo para super vendedor
            const main = document.querySelector('main');
            if (main) {
                const infoDiv = document.createElement('div');
                infoDiv.className = 'bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6';
                infoDiv.innerHTML = `
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <svg class="h-5 w-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <div class="ml-3">
                            <h3 class="text-sm font-medium text-blue-800">Panel de Super Vendedor</h3>
                            <div class="mt-2 text-sm text-blue-700">
                                <p>Como Super Vendedor, tienes acceso a reportes y ventas, pero no a la gestión de productos. Para registrar ventas ve a la sección de Reportes.</p>
                            </div>
                            <div class="mt-3">
                                <a href="/reportes.html" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition-colors">
                                    Ir a Reportes y Ventas
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                main.insertBefore(infoDiv, main.firstChild);
            }
        }
        
        function setupEventListeners() {
            document.getElementById('product-form').addEventListener('submit', handleFormSubmit);
            document.getElementById('products-list').addEventListener('click', handleListClick);
            document.getElementById('logout-button').addEventListener('click', () => signOut(auth));
            document.getElementById('cancel-edit-button').addEventListener('click', resetFormToCreate);
            setupNavigation();
            document.getElementById('manage-categories-button').addEventListener('click', () => document.getElementById('category-modal').classList.add('active'));
            document.getElementById('close-modal-button').addEventListener('click', () => document.getElementById('category-modal').classList.remove('active'));
            document.getElementById('add-category-button').addEventListener('click', handleAddCategory);
            document.getElementById('modal-category-list').addEventListener('click', handleDeleteCategory);
            
            // Funcionalidad de búsqueda
            document.getElementById('search-products').addEventListener('input', handleSearchProducts);
            
            // ✨ CAMBIO 3: Iniciamos el listener para la lista de productos ✨
            setupProductsListener();
        }

        // ✨ CAMBIO 4: Nueva función que escucha cambios en los productos en tiempo real ✨
        function setupProductsListener() {
            const productsListDiv = document.getElementById('products-list');
            const showAllBtn = document.getElementById('show-all-products');
            const showNoStockBtn = document.getElementById('show-no-stock');
            const q = query(collection(db, "products"));
            let currentFilter = 'all';

            function updateProductsList(products, filter) {
                const filteredProducts = filter === 'no-stock' 
                    ? products.filter(p => !p.stock || p.stock <= 0)
                    : products;

                if (filteredProducts.length === 0) {
                    productsListDiv.innerHTML = '<p class="text-gray-500 text-center">No hay productos ' + 
                        (filter === 'no-stock' ? 'sin stock.' : 'registrados.') + '</p>';
                    return;
                }

                // Actualizar contador de productos sin stock
                const noStockCount = products.filter(p => !p.stock || p.stock <= 0).length;
                showNoStockBtn.textContent = `Sin stock (${noStockCount})`;
                
                let html = '';
                filteredProducts.forEach((product) => {
                    const cost = product.acquisitionCost || 0;
                    const stock = product.stock || 0;
                    const price = product.price || 0;
                    const stockColor = stock > 10 ? 'text-green-600' : stock > 0 ? 'text-yellow-600' : 'text-red-600';
                    const bgColor = stock <= 0 ? 'bg-red-50' : 'bg-gray-50';
                    html += `
                        <div class="grid grid-cols-12 gap-4 items-center p-3 ${bgColor} rounded-md border ${stock <= 0 ? 'border-red-200' : 'border-gray-200'}">
                            <div class="col-span-2"><img src="${product.imageUrl}" alt="${product.name}" class="w-16 h-16 object-cover rounded-md"></div>
                            <div class="col-span-4">
                                <p class="font-semibold">${product.name}</p>
                                <p class="text-sm text-gray-500">${product.category}</p>
                                ${stock <= 0 ? '<span class="inline-block px-2 py-1 text-xs font-semibold bg-red-100 text-red-800 rounded-full mt-1">Sin Stock</span>' : ''}
                            </div>
                            <div class="col-span-2 text-sm"><p>Costo: S/ ${cost.toFixed(2)}</p><p>Venta: S/ ${price.toFixed(2)}</p></div>
                            <div class="col-span-2 text-sm font-semibold ${stockColor}">Stock: ${stock} uds.</div>
                            <div class="col-span-2 text-right space-x-2">
                                <button data-id="${product.id}" class="edit-button text-blue-500 hover:text-blue-700 font-semibold">Editar</button>
                                <button data-id="${product.id}" class="delete-button text-red-500 hover:text-red-700 font-semibold">Eliminar</button>
                            </div>
                        </div>
                    `;
                });
                productsListDiv.innerHTML = html;
            }

            showAllBtn.addEventListener('click', () => {
                showAllBtn.classList.add('bg-rose-500', 'text-white');
                showNoStockBtn.classList.remove('bg-rose-500', 'text-white');
                currentFilter = 'all';
                updateProductsList(allProducts, currentFilter);
            });

            showNoStockBtn.addEventListener('click', () => {
                showNoStockBtn.classList.add('bg-rose-500', 'text-white');
                showAllBtn.classList.remove('bg-rose-500', 'text-white');
                currentFilter = 'no-stock';
                updateProductsList(allProducts, currentFilter);
            });

            onSnapshot(q, (querySnapshot) => {
                let products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                
                // Ordenamos los productos por fecha de creación, los más nuevos primero
                products.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                
                // Guardamos los productos en una variable global para usarlos en los filtros
                window.allProducts = products;
                
                if (products.length === 0) {
                    productsListDiv.innerHTML = '<p>No hay productos registrados.</p>';
                    return;
                }

                const filteredProducts = currentFilter === 'no-stock' 
                    ? products.filter(p => !p.stock || p.stock <= 0)
                    : products;

                let html = '';
                filteredProducts.forEach((product) => {
                    const cost = product.acquisitionCost || 0;
                    const stock = product.stock || 0;
                    const price = product.price || 0;
                    const stockColor = stock > 10 ? 'text-green-600' : stock > 0 ? 'text-yellow-600' : 'text-red-600';
                    const bgColor = stock <= 0 ? 'bg-red-50' : 'bg-gray-50';
                    html += `
                        <div class="grid grid-cols-12 gap-4 items-center p-3 ${bgColor} rounded-md border ${stock <= 0 ? 'border-red-200' : 'border-gray-200'}">
                            <div class="col-span-2"><img src="${product.imageUrl}" alt="${product.name}" class="w-16 h-16 object-cover rounded-md"></div>
                            <div class="col-span-4">
                                <p class="font-semibold">${product.name}</p>
                                <p class="text-sm text-gray-500">${product.category}</p>
                                ${stock <= 0 ? '<span class="inline-block px-2 py-1 text-xs font-semibold bg-red-100 text-red-800 rounded-full mt-1">Sin Stock</span>' : ''}
                            </div>
                            <div class="col-span-2 text-sm"><p>Costo: S/ ${cost.toFixed(2)}</p><p>Venta: S/ ${price.toFixed(2)}</p></div>
                            <div class="col-span-2 text-sm font-semibold ${stockColor}">Stock: ${stock} uds.</div>
                            <div class="col-span-2 text-right space-x-2">
                                <button data-id="${product.id}" class="edit-button text-blue-500 hover:text-blue-700 font-semibold">Editar</button>
                                <button data-id="${product.id}" class="delete-button text-red-500 hover:text-red-700 font-semibold">Eliminar</button>
                            </div>
                        </div>
                    `;
                });
                productsListDiv.innerHTML = html;
            });
        }

        async function loadCategories() {
            // Usamos onSnapshot también para las categorías, por si las cambias en otro lado
            onSnapshot(query(collection(db, "categories")), (snapshot) => {
                categoriesCache = [];
                snapshot.forEach(doc => categoriesCache.push({ id: doc.id, ...doc.data() }));
                categoriesCache.sort((a, b) => a.name.localeCompare(b.name));
                populateCategorySelect();
                populateCategoryModalList();
            });
        }

        function populateCategorySelect() {
            const select = document.getElementById('category');
            select.innerHTML = '<option value="">-- Selecciona --</option>';
            categoriesCache.forEach(cat => {
                select.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
            });
        }

        function populateCategoryModalList() {
            const list = document.getElementById('modal-category-list');
            list.innerHTML = categoriesCache.length ? '' : '<p>No hay categorías.</p>';
            categoriesCache.forEach(cat => {
                list.innerHTML += `
                    <div class="flex justify-between items-center p-2 bg-gray-100 rounded">
                        <span>${cat.name}</span>
                        <button data-id="${cat.id}" class="delete-category-button text-red-500 hover:text-red-700 font-semibold">Eliminar</button>
                    </div>
                `;
            });
        }

        // Función para manejar la búsqueda de productos
        function handleSearchProducts(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            const productsListDiv = document.getElementById('products-list');
            
            if (!window.allProducts) return;
            
            let filteredProducts = window.allProducts;
            
            // Aplicar filtro de búsqueda si hay término de búsqueda
            if (searchTerm) {
                filteredProducts = window.allProducts.filter(product => {
                    const name = (product.name || '').toLowerCase();
                    const category = (product.category || '').toLowerCase();
                    return name.includes(searchTerm) || category.includes(searchTerm);
                });
            }
            
            // Aplicar filtro actual (todos/sin stock)
            const showNoStockBtn = document.getElementById('show-no-stock');
            const isNoStockFilter = showNoStockBtn.classList.contains('bg-rose-500');
            
            if (isNoStockFilter) {
                filteredProducts = filteredProducts.filter(p => !p.stock || p.stock <= 0);
            }
            
            // Mostrar productos filtrados
            if (filteredProducts.length === 0) {
                const message = searchTerm 
                    ? `No se encontraron productos que coincidan con "${searchTerm}"`
                    : 'No hay productos que mostrar';
                productsListDiv.innerHTML = `<p class="text-gray-500 text-center">${message}</p>`;
                return;
            }
            
            let html = '';
            filteredProducts.forEach((product) => {
                const cost = product.acquisitionCost || 0;
                const stock = product.stock || 0;
                const price = product.price || 0;
                const stockColor = stock > 10 ? 'text-green-600' : stock > 0 ? 'text-yellow-600' : 'text-red-600';
                const bgColor = stock <= 0 ? 'bg-red-50' : 'bg-gray-50';
                html += `
                    <div class="grid grid-cols-12 gap-4 items-center p-3 ${bgColor} rounded-md border ${stock <= 0 ? 'border-red-200' : 'border-gray-200'}">
                        <div class="col-span-2"><img src="${product.imageUrl}" alt="${product.name}" class="w-16 h-16 object-cover rounded-md"></div>
                        <div class="col-span-4">
                            <p class="font-semibold">${product.name}</p>
                            <p class="text-sm text-gray-500">${product.category}</p>
                            ${stock <= 0 ? '<span class="inline-block px-2 py-1 text-xs font-semibold bg-red-100 text-red-800 rounded-full mt-1">Sin Stock</span>' : ''}
                        </div>
                        <div class="col-span-2 text-sm"><p>Costo: S/ ${cost.toFixed(2)}</p><p>Venta: S/ ${price.toFixed(2)}</p></div>
                        <div class="col-span-2 text-sm font-semibold ${stockColor}">Stock: ${stock} uds.</div>
                        <div class="col-span-2 text-right space-x-2">
                            <button data-id="${product.id}" class="edit-button text-blue-500 hover:text-blue-700 font-semibold">Editar</button>
                            <button data-id="${product.id}" class="delete-button text-red-500 hover:text-red-700 font-semibold">Eliminar</button>
                        </div>
                    </div>
                `;
            });
            productsListDiv.innerHTML = html;
        }

        async function handleAddCategory() {
            const input = document.getElementById('new-category-name');
            const newName = input.value.trim();
            if (!newName) return;

            const normalizedName = newName.charAt(0).toUpperCase() + newName.slice(1).toLowerCase();
            const exists = categoriesCache.some(cat => cat.name.toLowerCase() === normalizedName.toLowerCase());
            
            if (exists) {
                alert('Esa categoría ya existe.');
                return;
            }

            try {
                await addDoc(collection(db, "categories"), { name: normalizedName });
                input.value = '';
                // No necesitamos llamar a loadCategories, el listener lo hará solo.
            } catch (error) {
                console.error("Error al añadir categoría:", error);
            }
        }

        async function handleDeleteCategory(e) {
            if (!e.target.classList.contains('delete-category-button')) return;
            const categoryId = e.target.dataset.id;
            if (confirm('¿Seguro que quieres eliminar esta categoría?')) {
                try {
                    await deleteDoc(doc(db, "categories", categoryId));
                } catch (error) {
                    console.error("Error al eliminar categoría:", error);
                }
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            // Verificar permisos para gestión de productos
            if (!isSuperAdmin(auth.currentUser?.email)) {
                alert('No tienes permisos para gestionar productos. Solo los Super Administradores pueden añadir, editar o eliminar productos.');
                return;
            }
            
            const productId = document.getElementById('productId').value;
            const imageFile = document.getElementById('image').files[0];
            const imageFile2 = document.getElementById('image2').files[0];
            const imageFile3 = document.getElementById('image3').files[0];
            const imageFile4 = document.getElementById('image4').files[0];
            const data = getFormData();

            const filesToUpload = [
                { file: imageFile, key: 'imageUrl' },
                { file: imageFile2, key: 'imageUrl2' },
                { file: imageFile3, key: 'imageUrl3' },
                { file: imageFile4, key: 'imageUrl4' },
            ].filter(item => item.file);

            if (productId) {
                if (filesToUpload.length > 0) {
                    await uploadImagesAndUpdate(productId, filesToUpload, data);
                } else {
                    await updateProduct(productId, data);
                }
            } else {
                if (!imageFile) {
                    alert('La imagen principal es obligatoria.');
                    return;
                }
                await uploadImagesAndCreate(filesToUpload, data);
            }
        }

        function getFormData() {
            // Obtener el contenido HTML del editor TinyMCE
            const descriptionContent = tinymce.get('description') ? tinymce.get('description').getContent() : '';
            
            return {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                originalPrice: parseFloat(document.getElementById('originalPrice').value) || 0,
                acquisitionCost: parseFloat(document.getElementById('acquisitionCost').value) || 0,
                stock: parseInt(document.getElementById('stock').value, 10) || 0,
                code: document.getElementById('code').value,
                description: descriptionContent,
            };
        }

        async function uploadImagesAndCreate(files, data) {
            const uploadProgress = document.getElementById('upload-progress');
            uploadProgress.classList.remove('hidden');
            
            const uploadPromises = files.map(item => {
                const storageRef = ref(storage, `products/${Date.now()}_${item.file.name}`);
                const uploadTask = uploadBytesResumable(storageRef, item.file);
                return new Promise((resolve, reject) => {
                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            uploadProgress.value = progress;
                        },
                        (error) => reject(error),
                        async () => {
                            const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                            resolve({ key: item.key, url: downloadURL });
                        }
                    );
                });
            });

            try {
                const uploadedImages = await Promise.all(uploadPromises);
                uploadedImages.forEach(img => data[img.key] = img.url);
                data.createdAt = new Date(); // Aseguramos que tenga fecha de creación
                await addDoc(collection(db, 'products'), data);
                resetFormToCreate();
                // ✨ CAMBIO 5: Ya no necesitamos llamar a loadProducts() aquí ✨
            } catch (error) {
                console.error("Error al subir imágenes y crear producto:", error);
            }
        }

        async function uploadImagesAndUpdate(productId, files, data) {
            const uploadProgress = document.getElementById('upload-progress');
            uploadProgress.classList.remove('hidden');

            const uploadPromises = files.map(item => {
                const storageRef = ref(storage, `products/${Date.now()}_${item.file.name}`);
                const uploadTask = uploadBytesResumable(storageRef, item.file);
                return new Promise((resolve, reject) => {
                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            uploadProgress.value = progress;
                        },
                        (error) => reject(error),
                        async () => {
                            const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                            resolve({ key: item.key, url: downloadURL });
                        }
                    );
                });
            });

            try {
                const uploadedImages = await Promise.all(uploadPromises);
                uploadedImages.forEach(img => data[img.key] = img.url);
                await updateProduct(productId, data);
            } catch (error) {
                console.error("Error al subir imágenes y actualizar producto:", error);
            }
        }

        async function updateProduct(productId, data) {
             try {
                await updateDoc(doc(db, "products", productId), data);
                resetFormToCreate();
                // ✨ CAMBIO 5: Ya no necesitamos llamar a loadProducts() aquí ✨
            } catch (error) {
                console.error("Error al actualizar el producto:", error);
            }
        }

        async function handleListClick(e) {
            if (e.target.classList.contains('delete-button')) {
                // Verificar permisos para eliminar productos
                if (!isSuperAdmin(auth.currentUser?.email)) {
                    alert('No tienes permisos para eliminar productos. Solo los Super Administradores pueden gestionar productos.');
                    return;
                }
                
                const id = e.target.dataset.id;
                if (confirm('¿Estás seguro de que quieres eliminar este producto?')) {
                    try {
                        await deleteDoc(doc(db, "products", id));
                        // ✨ CAMBIO 5: Ya no necesitamos llamar a loadProducts() aquí ✨
                    } catch (error) {
                        console.error("Error al eliminar:", error);
                    }
                }
            }
            if (e.target.classList.contains('edit-button')) {
                // Verificar permisos para editar productos
                if (!isSuperAdmin(auth.currentUser?.email)) {
                    alert('No tienes permisos para editar productos. Solo los Super Administradores pueden gestionar productos.');
                    return;
                }
                await populateFormForEdit(e.target.dataset.id);
            }
        }

        async function populateFormForEdit(id) {
            try {
                const docSnap = await getDoc(doc(db, "products", id));
                if (docSnap.exists()) {
                    const product = docSnap.data();
                    document.getElementById('productId').value = id;
                    document.getElementById('name').value = product.name || '';
                    document.getElementById('category').value = product.category || '';
                    document.getElementById('price').value = product.price || 0;
                    document.getElementById('originalPrice').value = product.originalPrice || 0;
                    document.getElementById('acquisitionCost').value = product.acquisitionCost || 0;
                    document.getElementById('stock').value = product.stock || 0;
                    document.getElementById('code').value = product.code || '';
                    
                    // Cargar el contenido en TinyMCE
                    if (tinymce.get('description')) {
                        tinymce.get('description').setContent(product.description || '');
                    } else {
                        // Si TinyMCE no está listo, usar el textarea normal
                        document.getElementById('description').value = product.description || '';
                    }
                    
                    document.getElementById('form-title').textContent = 'Editar Producto';
                    document.getElementById('submit-button').textContent = 'Actualizar Producto';
                    document.getElementById('cancel-edit-button').classList.remove('hidden');
                    window.location.hash = "form-section";
                }
            } catch (error) {
                console.error("Error al cargar para editar:", error);
            }
        }

        function resetFormToCreate() {
            document.getElementById('product-form').reset();
            document.getElementById('productId').value = '';
            document.getElementById('image2').value = '';
            document.getElementById('image3').value = '';
            document.getElementById('image4').value = '';
            
            // Limpiar el contenido de TinyMCE
            if (tinymce.get('description')) {
                tinymce.get('description').setContent('');
            }
            
            document.getElementById('form-title').textContent = 'Añadir Nuevo Producto';
            document.getElementById('submit-button').textContent = 'Guardar Producto';
            document.getElementById('cancel-edit-button').classList.add('hidden');
            document.getElementById('upload-progress').classList.add('hidden');
        }

        // Inicializar TinyMCE
        function initTinyMCE() {
            tinymce.init({
                selector: '#description',
                height: 300,
                menubar: false,
                plugins: [
                    'lists', 'link', 'charmap', 'preview',
                    'searchreplace', 'visualblocks', 'code', 'fullscreen',
                    'insertdatetime', 'table', 'help', 'wordcount'
                ],
                toolbar: 'undo redo | formatselect | ' +
                    'bold italic underline strikethrough | alignleft aligncenter ' +
                    'alignright alignjustify | bullist numlist outdent indent | ' +
                    'removeformat | help',
                content_style: 'body { font-family:Inter,sans-serif; font-size:14px }',
                language: 'es',
                branding: false,
                promotion: false
            });
        }

        // Llamar a initTinyMCE después de que el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            initTinyMCE();
        });

        main();
    </script>
</body>
</html>
