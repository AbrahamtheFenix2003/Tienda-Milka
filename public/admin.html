<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 sm:px-6 lg:p-8 flex justify-between items-center h-16">
            <h1 class="text-xl font-bold text-gray-800">Panel de Administración</h1>
            <button id="logout-button" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Formulario para Añadir/Editar Productos -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-bold mb-4">Añadir Nuevo Producto</h2>
            <form id="product-form" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Nombre del Producto</label>
                        <input type="text" id="name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-rose-500 focus:ring-rose-500" required>
                    </div>
                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700">Categoría</label>
                        <input type="text" id="category" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-rose-500 focus:ring-rose-500" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="price" class="block text-sm font-medium text-gray-700">Precio (S/)</label>
                        <input type="number" step="0.01" id="price" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-rose-500 focus:ring-rose-500" required>
                    </div>
                    <div>
                        <label for="originalPrice" class="block text-sm font-medium text-gray-700">Precio Original (S/) (Opcional)</label>
                        <input type="number" step="0.01" id="originalPrice" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-rose-500 focus:ring-rose-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="code" class="block text-sm font-medium text-gray-700">Código (SKU)</label>
                        <input type="text" id="code" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-rose-500 focus:ring-rose-500">
                    </div>
                    <div>
                        <label for="image" class="block text-sm font-medium text-gray-700">Imagen del Producto</label>
                        <input type="file" id="image" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100" required>
                        <progress id="upload-progress" value="0" max="100" class="w-full mt-2 hidden"></progress>
                    </div>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Descripción</label>
                    <textarea id="description" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-rose-500 focus:ring-rose-500"></textarea>
                </div>

                <div class="text-right">
                    <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline transition-colors">
                        Guardar Producto
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de Productos Existentes -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">Productos Existentes</h2>
            <div id="products-list" class="space-y-4">
                <p>Cargando productos...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApegF3TQ4s2QLBWifxQqHuQ6IVGPjy-8c",
            authDomain: "braholet-importaciones.firebaseapp.com",
            projectId: "braholet-importaciones",
            // ESTA ES LA LÍNEA CORREGIDA:
            storageBucket: "braholet-importaciones.firebasestorage.app",
            messagingSenderId: "299104716322",
            appId: "1:299104716322:web:53d239b829aa7a40ed6c7b",
            measurementId: "G-79DPZ14Z23"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const productForm = document.getElementById('product-form');
        const productsList = document.getElementById('products-list');
        const logoutButton = document.getElementById('logout-button');
        const uploadProgress = document.getElementById('upload-progress');

        // Proteger la página: si no hay usuario, redirigir al login
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                loadProducts();
            }
        });

        // Cerrar sesión
        logoutButton.addEventListener('click', async () => {
            await signOut(auth);
        });

        // Manejar el envío del formulario
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const imageFile = document.getElementById('image').files[0];

            if (!imageFile) {
                alert('Por favor, selecciona una imagen.');
                return;
            }

            const storageRef = ref(storage, `products/${Date.now()}_${imageFile.name}`);
            const uploadTask = uploadBytesResumable(storageRef, imageFile);

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    uploadProgress.value = progress;
                    uploadProgress.classList.remove('hidden');
                }, 
                (error) => {
                    console.error("Error al subir la imagen:", error);
                    alert('Error al subir la imagen.');
                }, 
                async () => {
                    const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                    
                    const newProduct = {
                        name: document.getElementById('name').value,
                        category: document.getElementById('category').value,
                        price: parseFloat(document.getElementById('price').value),
                        originalPrice: parseFloat(document.getElementById('originalPrice').value) || 0,
                        code: document.getElementById('code').value,
                        description: document.getElementById('description').value,
                        imageUrl: downloadURL
                    };

                    try {
                        await addDoc(collection(db, 'products'), newProduct);
                        productForm.reset();
                        uploadProgress.classList.add('hidden');
                        alert('¡Producto guardado exitosamente!');
                        loadProducts();
                    } catch (error) {
                        console.error("Error al guardar el producto:", error);
                        alert('Error al guardar el producto.');
                    }
                }
            );
        });
        
        // Cargar y mostrar productos existentes
        async function loadProducts() {
            productsList.innerHTML = '<p>Cargando productos...</p>';
            const querySnapshot = await getDocs(collection(db, "products"));
            let html = '';
            if (querySnapshot.empty) {
                productsList.innerHTML = '<p>No hay productos existentes.</p>';
                return;
            }
            querySnapshot.forEach((doc) => {
                const product = doc.data();
                html += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-md">
                        <div class="flex items-center space-x-4">
                            <img src="${product.imageUrl}" alt="${product.name}" class="w-16 h-16 object-cover rounded-md">
                            <div>
                                <p class="font-semibold">${product.name}</p>
                                <p class="text-sm text-gray-500">${product.category}</p>
                            </div>
                        </div>
                        <div>
                            <button data-id="${doc.id}" class="delete-button text-red-500 hover:text-red-700 font-semibold">Eliminar</button>
                        </div>
                    </div>
                `;
            });
            productsList.innerHTML = html;
        }

        // Manejar la eliminación de productos
        productsList.addEventListener('click', async (e) => {
            if (e.target.classList.contains('delete-button')) {
                const id = e.target.dataset.id;
                if (confirm('¿Estás seguro de que quieres eliminar este producto?')) {
                    try {
                        await deleteDoc(doc(db, "products", id));
                        alert('Producto eliminado.');
                        loadProducts();
                    } catch (error) {
                        console.error("Error al eliminar el producto:", error);
                        alert('Error al eliminar el producto.');
                    }
                }
            }
        });

    </script>
</body>
</html>
