<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda E-commerce</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilo personalizado para usar la fuente Inter */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilo para el scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Pequeña animación para la carga de productos */
        .product-card {
            animation: fadeIn 0.5s ease-in-out;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Encabezado -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <a href="index.html" class="text-2xl font-bold text-rose-500">XOARA</a>
                    <p class="text-xs text-gray-400 -mt-1">ONLINE STORE</p>
                </div>

                <!-- Barra de búsqueda -->
                <div class="hidden md:flex flex-1 justify-center px-8">
                    <div class="relative w-full max-w-lg">
                        <input type="search" placeholder="¿Qué estás buscando?" class="w-full bg-gray-100 border border-gray-200 rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-transparent">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Iconos de la derecha -->
                <div class="flex items-center space-x-4">
                    <a href="#" class="text-gray-500 hover:text-rose-500">
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c.51 0 .962-.344 1.087-.849l1.858-6.443a.75.75 0 0 0-.7-1.002H5.632l-.305-1.148A.75.75 0 0 0 4.5 3H2.25" />
                        </svg>
                    </a>
                    <a href="#" class="text-gray-500 hover:text-rose-500">
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                    </a>
                </div>
            </div>
             <!-- Barra de búsqueda para móviles -->
            <div class="md:hidden pb-4">
                <div class="relative w-full">
                    <input type="search" placeholder="¿Qué estás buscando?" class="w-full bg-gray-100 border border-gray-200 rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-transparent">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="lg:grid lg:grid-cols-12 lg:gap-8">

            <!-- Barra Lateral de Filtros (Sidebar) -->
            <aside class="lg:col-span-3">
                <h2 class="sr-only">Filtros</h2>
                <div class="space-y-6">
                    <!-- Filtro de Categorías -->
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800 mb-3">Categorías</h3>
                        <ul id="category-list" class="space-y-2">
                             <li><p class="text-gray-500">Cargando...</p></li>
                        </ul>
                    </div>
                    <!-- Filtro de Ordenar por -->
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800 mb-3">Ordenar por</h3>
                        <ul class="space-y-2">
                            <li><a href="#" class="text-rose-600 font-semibold">Relevancia</a></li>
                            <li><a href="#" class="text-gray-600 hover:text-rose-600">Menor precio</a></li>
                            <li><a href="#" class="text-gray-600 hover:text-rose-600">Mayor precio</a></li>
                        </ul>
                    </div>
                    <!-- Información de Contacto -->
                    <div class="space-y-4 pt-6 border-t">
                         <h3 class="text-lg font-semibold text-gray-800">Contacto</h3>
                         <div class="flex items-center space-x-2 text-gray-600">
                            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 6.75Z" /></svg>
                            <span>+51 938 256 218</span>
                         </div>
                         <div class="flex items-center space-x-2 text-gray-600">
                             <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" /></svg>
                            <span>Av. Manco Capac 532, La Victoria</span>
                         </div>
                    </div>
                </div>
            </aside>

            <!-- Cuadrícula de Productos -->
            <main class="lg:col-span-9 mt-6 lg:mt-0">
                <h1 id="main-title" class="text-3xl font-bold text-gray-900 mb-6">Todo</h1>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <p id="loading-message">Cargando productos...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- TU CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyApegF3TQ4s2QLBWifxQqHuQ6IVGPjy-8c",
            authDomain: "braholet-importaciones.firebaseapp.com",
            projectId: "braholet-importaciones",
            storageBucket: "braholet-importaciones.appspot.com",
            messagingSenderId: "299104716322",
            appId: "1:299104716322:web:53d239b829aa7a40ed6c7b",
            measurementId: "G-79DPZ14Z23"
        };
        
        // --- LÓGICA DE LA TIENDA ---
        const productGrid = document.getElementById('product-grid');
        const categoryList = document.getElementById('category-list');
        const loadingMessage = document.getElementById('loading-message');
        const mainTitle = document.getElementById('main-title');
        let allProducts = [];

        // --- FUNCIÓN PRINCIPAL ASÍNCRONA ---
        async function main() {
            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                await signInAnonymously(auth);
                await fetchAndRenderProducts(db);
            } catch (error) {
                console.error("❌ Error en la inicialización o carga:", error);
                if (loadingMessage) {
                    loadingMessage.innerText = 'Error al conectar con el servidor. Revisa la consola.';
                }
            }
        }

        main();

        async function fetchAndRenderProducts(db) {
            try {
                const productsCollectionRef = collection(db, 'products');
                const querySnapshot = await getDocs(productsCollectionRef);
                
                if (querySnapshot.empty) {
                    if (loadingMessage) {
                        loadingMessage.innerText = 'No se encontraron productos. Agrega algunos en tu base de datos de Firestore.';
                    }
                    return;
                }

                allProducts = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                renderProducts(allProducts);
                renderCategories();
            } catch (error) {
                console.error("❌ Error obteniendo productos de Firestore:", error);
                if (loadingMessage) {
                    loadingMessage.innerText = 'Error al cargar los productos. Revisa las reglas de seguridad de Firestore.';
                }
            }
        }

        function renderProducts(products) {
            productGrid.innerHTML = '';
            if (products.length === 0) {
                 productGrid.innerHTML = '<p>No se encontraron productos en esta categoría.</p>';
                 return;
            }
            products.forEach(product => {
                const productCardHTML = createProductCard(product);
                productGrid.innerHTML += productCardHTML;
            });
        }
        
        function createProductCard(product) {
            const price = parseFloat(product.price || 0);
            const originalPrice = parseFloat(product.originalPrice || 0);
            const hasDiscount = originalPrice > 0 && originalPrice > price;
            const discountPercentage = hasDiscount ? Math.round(((originalPrice - price) / originalPrice) * 100) : 0;

            // CORRECCIÓN: Se ha quitado la barra "/" inicial en el href para que el enlace sea relativo.
            return `
                <a href="producto.html?id=${product.id}" class="block bg-white rounded-lg shadow-md overflow-hidden group product-card">
                    <div class="relative">
                        <img src="${product.imageUrl || 'https://placehold.co/400x400/f0f0f0/333?text=Producto'}" 
                             onerror="this.onerror=null;this.src='https://placehold.co/400x400/f0f0f0/333?text=Error';"
                             alt="${product.name || 'Nombre no disponible'}" class="w-full h-56 object-cover">
                        ${hasDiscount ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-xs font-semibold px-2 py-1 rounded-md">${discountPercentage}% OFF</span>` : ''}
                    </div>
                    <div class="p-4">
                        <span class="text-xs text-gray-500">${product.category || 'Sin categoría'}</span>
                        <h4 class="text-md font-semibold text-gray-800 mt-1 truncate">${product.name || 'Nombre no disponible'}</h4>
                        <p class="text-sm text-gray-600">${product.code || ''}</p>
                        <div class="mt-3">
                            <span class="text-lg font-bold text-rose-600">S/ ${price.toFixed(2)}</span>
                            ${hasDiscount ? `<span class="text-sm text-gray-500 line-through ml-2">S/ ${originalPrice.toFixed(2)}</span>` : ''}
                        </div>
                        <div class="w-full mt-4 bg-gray-800 text-white py-2 rounded-lg group-hover:bg-rose-600 transition-colors text-center">
                            Ver detalle
                        </div>
                    </div>
                </a>
            `;
        }
        
        function renderCategories() {
            const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
            categoryList.innerHTML = `<li><a href="#" class="category-filter text-rose-600 font-semibold" data-category="all">Todo</a></li>`;
            categories.forEach(category => {
                categoryList.innerHTML += `<li><a href="#" class="category-filter text-gray-600 hover:text-rose-600" data-category="${category}">${category}</a></li>`;
            });
            
            document.querySelectorAll('.category-filter').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const selectedCategory = e.target.dataset.category;
                    
                    document.querySelectorAll('.category-filter').forEach(l => {
                        l.classList.remove('text-rose-600', 'font-semibold');
                        l.classList.add('text-gray-600');
                    });
                    e.target.classList.add('text-rose-600', 'font-semibold');
                    e.target.classList.remove('text-gray-600');

                    filterProducts(selectedCategory);
                });
            });
        }

        function filterProducts(category) {
            mainTitle.innerText = category === 'all' ? 'Todo' : category;
            const filteredProducts = category === 'all' 
                ? allProducts 
                : allProducts.filter(p => p.category === category);
            renderProducts(filteredProducts);
        }
    </script>
</body>
</html>
