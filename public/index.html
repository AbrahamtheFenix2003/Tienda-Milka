<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda E-commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; opacity: 0; transition: opacity 0.5s; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .product-card {
            animation: fadeIn 0.5s ease-in-out;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <div class="flex space-x-1">
                        <button id="back-button" title="Atrás" class="p-2 rounded-full hover:bg-gray-200 transition-colors">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button id="forward-button" title="Adelante" class="p-2 rounded-full hover:bg-gray-200 transition-colors">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                    <div class="flex-shrink-0">
                        <a href="index.html" class="text-2xl font-bold text-rose-500">BRAHOLET</a>
                        <p class="text-xs text-gray-400 -mt-1">IMPORTACIONES</p>
                    </div>
                </div>
                <div id="user-controls" class="flex items-center space-x-4"></div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="lg:grid lg:grid-cols-12 lg:gap-8">
            <!-- Menú de Filtros Off-canvas (Sidebar) -->
            <div id="mobile-filter-overlay" class="fixed inset-0 bg-black bg-opacity-25 z-40 hidden lg:hidden"></div>
            <aside id="filter-sidebar" class="fixed top-0 left-0 w-64 h-full bg-white shadow-xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 lg:col-span-3 lg:h-auto lg:bg-transparent lg:shadow-none lg:z-auto">
                <div class="p-4 lg:p-0 h-full overflow-y-auto">
                    <div class="flex justify-between items-center mb-4 lg:hidden">
                        <h3 class="text-lg font-semibold text-gray-800">Filtros</h3>
                        <button id="close-filter-btn" class="text-gray-500 hover:text-gray-800">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800 mb-3">Categorías</h3>
                            <ul id="category-list" class="space-y-2">
                                 <li><p class="text-gray-500">Cargando...</p></li>
                            </ul>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800 mb-3">Ordenar por</h3>
                            <ul id="sort-options" class="space-y-2">
                                <li><a href="#" class="sort-filter text-rose-600 font-semibold" data-sort="relevance">Relevancia</a></li>
                                <li><a href="#" class="sort-filter text-gray-600 hover:text-rose-600" data-sort="price-asc">Menor precio</a></li>
                                <li><a href="#" class="sort-filter text-gray-600 hover:text-rose-600" data-sort="price-desc">Mayor precio</a></li>
                            </ul>
                        </div>
                        <div class="space-y-4 pt-6 border-t">
                             <h3 class="text-lg font-semibold text-gray-800">Contacto</h3>
                             <div class="flex items-center space-x-2 text-gray-600">
                                <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 6.75Z" /></svg>
                                <span>+51 938 256 218</span>
                             </div>
                             <div class="flex items-center space-x-2 text-gray-600">
                                 <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" /></svg>
                                <span>Av. Manco Capac 532, La Victoria</span>
                             </div>
                             <div class="flex items-center space-x-2 text-gray-600">
                                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clip-rule="evenodd" /></svg>
                                <a href="https://www.facebook.com/profile.php?id=100066980643442&locale=es_LA" target="_blank" rel="noopener noreferrer" class="hover:text-rose-600">BRAHOLET en Facebook</a>
                             </div>
                             <div class="flex items-center space-x-2 text-gray-600">
                                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 012.153 2.153c-.247.636.416 1.363.465 2.427.048 1.024.06 1.378.06 3.808s-.012 2.784-.06 3.808c-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-2.153 2.153c-.636.247-1.363.416-2.427.465-1.024.048-1.378.06-3.808.06s-2.784-.013-3.808-.06c-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-2.153-2.153c-.247-.636-.416-1.363-.465-2.427-.048-1.024-.06-1.378-.06-3.808s.012-2.784.06-3.808c.049-1.064.218-1.791.465-2.427a4.902 4.902 0 012.153-2.153c.636-.247 1.363.416 2.427-.465C9.53 2.013 9.884 2 12.315 2zm0 2.163c-2.403 0-2.748.01-3.727.055-1.007.046-1.634.211-2.203.423a2.72 2.72 0 00-1.15 1.15c-.212.57-.378 1.196-.423 2.203-.045.979-.055 1.324-.055 3.727s.01 2.748.055 3.727c.046 1.007.211 1.634.423 2.203a2.72 2.72 0 001.15 1.15c.57.212 1.196.378 2.203.423.979.045 1.324.055 3.727.055s2.748-.01 3.727-.055c1.007-.046 1.634-.211 2.203-.423a2.72 2.72 0 001.15-1.15c.212-.57.378-1.196.423-2.203.045-.979.055-1.324-.055-3.727s-.01-2.748-.055-3.727c-.046-1.007-.211-1.634-.423-2.203a2.72 2.72 0 00-1.15-1.15c-.57-.212-1.196-.378-2.203-.423-.979-.045-1.324-.055-3.727-.055zm0 3.823a3.736 3.736 0 100 7.472 3.736 3.736 0 000-7.472zm0 5.823a2.087 2.087 0 110-4.174 2.087 2.087 0 010 4.174zM16.425 5.332a1.21 1.21 0 100 2.42 1.21 1.21 0 000-2.42z" clip-rule="evenodd" /></svg>
                                <a href="https://www.instagram.com/braholet_importaciones?igsh=MXd1OGI0NmNhdWF0ag%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="hover:text-rose-600">@braholet.store</a>
                             </div>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="lg:col-span-9 mt-6 lg:mt-0">
                <div class="flex justify-between items-center mb-6">
                    <h1 id="main-title" class="text-3xl font-bold text-gray-900">Todo</h1>
                    <button id="open-filter-btn" class="lg:hidden p-2 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" /></svg>
                    </button>
                </div>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <p id="loading-message">Verificando acceso y cargando productos...</p>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const ADMIN_EMAIL = 'elinquisidor09@gmail.com'; 
        let db, auth, allProducts = [], currentlyDisplayedProducts = [], currentSort = 'relevance';
        const filterSidebar = document.getElementById('filter-sidebar');
        const openFilterBtn = document.getElementById('open-filter-btn');
        const closeFilterBtn = document.getElementById('close-filter-btn');
        const mobileFilterOverlay = document.getElementById('mobile-filter-overlay');

        // --- MANEJO DEL MENÚ DE FILTROS MÓVIL ---
        function setupFilterMenu() {
            openFilterBtn.addEventListener('click', () => {
                filterSidebar.classList.remove('-translate-x-full');
                mobileFilterOverlay.classList.remove('hidden');
            });

            closeFilterBtn.addEventListener('click', closeMenu);
            mobileFilterOverlay.addEventListener('click', closeMenu);
        }

        function closeMenu() {
            filterSidebar.classList.add('-translate-x-full');
            mobileFilterOverlay.classList.add('hidden');
        }


        async function main() {
            try {
                const response = await fetch('/__/firebase/init.json');
                const firebaseConfig = await response.json();
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setupNavigation();
                setupFilterMenu();
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.body.style.opacity = '1';
                        setupUserControls(user);
                        initialDataLoad();
                    } else {
                        window.location.href = '/login-cliente.html';
                    }
                });
            } catch (error) {
                console.error("❌ Error en la inicialización:", error);
            }
        }

        async function initialDataLoad() {
            await fetchAndRenderProducts();
            await renderCategories();
        }

        function setupNavigation() {
            document.getElementById('back-button').addEventListener('click', () => window.history.back());
            document.getElementById('forward-button').addEventListener('click', () => window.history.forward());
        }

        function setupUserControls(user) {
            const userControlsDiv = document.getElementById('user-controls');
            let controlsHTML = '';
            if (user.email === ADMIN_EMAIL) {
                controlsHTML += `<a href="/admin.html" class="bg-rose-500 text-white text-sm font-semibold px-3 py-1.5 rounded-md hover:bg-rose-600">Panel Admin</a>`;
            }
            controlsHTML += `
                <div class="text-right">
                    <p class="text-sm font-medium text-gray-800">${user.displayName || user.email}</p>
                    <button id="logout-button" class="text-xs text-gray-500 hover:underline">Cerrar Sesión</button>
                </div>
            `;
            userControlsDiv.innerHTML = controlsHTML;
            document.getElementById('logout-button').addEventListener('click', () => signOut(auth));
        }

        async function fetchAndRenderProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                querySnapshot.forEach((doc) => allProducts.push({ id: doc.id, ...doc.data() }));
                currentlyDisplayedProducts = [...allProducts];
                sortAndRender();
            } catch (error) {
                console.error("❌ Error obteniendo productos:", error);
            }
        }

        async function renderCategories() {
            const categoryList = document.getElementById('category-list');
            categoryList.innerHTML = '<li><p class="text-gray-500">Cargando...</p></li>';
            try {
                const querySnapshot = await getDocs(collection(db, "categories"));
                let categories = [];
                querySnapshot.forEach(doc => categories.push(doc.data()));
                categories.sort((a, b) => a.name.localeCompare(b.name));

                categoryList.innerHTML = `<li><a href="#" class="category-filter text-rose-600 font-semibold" data-category="all">Todo</a></li>`;
                categories.forEach(category => {
                    categoryList.innerHTML += `<li><a href="#" class="category-filter text-gray-600 hover:text-rose-600" data-category="${category.name}">${category.name}</a></li>`;
                });
                
                document.querySelectorAll('.category-filter').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        document.querySelectorAll('.category-filter').forEach(l => l.classList.remove('text-rose-600', 'font-semibold'));
                        e.target.classList.add('text-rose-600', 'font-semibold');
                        filterProducts(e.target.dataset.category);
                    });
                });
                setupSortControls();
            } catch (error) {
                console.error("Error al cargar categorías:", error);
                categoryList.innerHTML = '<li><p class="text-red-500">Error</p></li>';
            }
        }

        function renderProducts(products) {
            const productGrid = document.getElementById('product-grid');
            productGrid.innerHTML = products.length ? '' : '<p>No se encontraron productos.</p>';
            products.forEach(product => productGrid.innerHTML += createProductCard(product));
        }

        function createProductCard(product) {
            const price = product.price || 0;
            const originalPrice = product.originalPrice || 0;
            const hasDiscount = originalPrice > 0 && originalPrice > price;
            const discountPercentage = hasDiscount ? Math.round(((originalPrice - price) / originalPrice) * 100) : 0;
            return `
                <a href="producto.html?id=${product.id}" class="block bg-white rounded-lg shadow-md overflow-hidden group product-card">
                    <div class="relative">
                        <img src="${product.imageUrl || 'https://placehold.co/400x400/f0f0f0/333?text=Producto'}" 
                             onerror="this.onerror=null;this.src='https://placehold.co/400x400/f0f0f0/333?text=Error';"
                             alt="${product.name || 'Nombre no disponible'}" class="w-full h-56 object-cover">
                        ${hasDiscount ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-xs font-semibold px-2 py-1 rounded-md">${discountPercentage}% OFF</span>` : ''}
                    </div>
                    <div class="p-4">
                        <span class="text-xs text-gray-500">${product.category || 'Sin categoría'}</span>
                        <h4 class="text-md font-semibold text-gray-800 mt-1 truncate">${product.name || 'Nombre no disponible'}</h4>
                        <p class="text-sm text-gray-600">${product.code || ''}</p>
                        <div class="mt-3">
                            <span class="text-lg font-bold text-rose-600">S/ ${price.toFixed(2)}</span>
                            ${hasDiscount ? `<span class="text-sm text-gray-500 line-through ml-2">S/ ${originalPrice.toFixed(2)}</span>` : ''}
                        </div>
                        <div class="w-full mt-4 bg-gray-800 text-white py-2 rounded-lg group-hover:bg-rose-600 transition-colors text-center">
                            Ver detalle
                        </div>
                    </div>
                </a>
            `;
        }
        
        function filterProducts(category) {
            document.getElementById('main-title').innerText = category === 'all' ? 'Todo' : category;
            currentlyDisplayedProducts = category === 'all' ? [...allProducts] : allProducts.filter(p => p.category === category);
            sortAndRender();
        }

        function setupSortControls() {
            document.querySelectorAll('.sort-filter').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentSort = e.target.dataset.sort;
                    document.querySelectorAll('.sort-filter').forEach(l => l.classList.remove('text-rose-600', 'font-semibold'));
                    e.target.classList.add('text-rose-600', 'font-semibold');
                    sortAndRender();
                });
            });
        }

        function sortAndRender() {
            switch (currentSort) {
                case 'price-asc':
                    currentlyDisplayedProducts.sort((a, b) => (a.price || 0) - (b.price || 0));
                    break;
                case 'price-desc':
                    currentlyDisplayedProducts.sort((a, b) => (b.price || 0) - (a.price || 0));
                    break;
                case 'relevance':
                default:
                    currentlyDisplayedProducts.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    break;
            }
            renderProducts(currentlyDisplayedProducts);
        }

        main();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('SW registrado:', registration))
                    .catch(error => console.log('Error de registro de SW:', error));
            });
        }
    </script>
</body>
</html>
