<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a BRAHOLET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-8 text-center">
        <h1 class="text-3xl font-bold text-rose-500 mb-2">BRAHOLET</h1>
        <p class="text-gray-500 mb-8">Para continuar, por favor inicia sesión.</p>
        
        <button id="google-login-button" class="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg flex items-center justify-center hover:bg-gray-50 transition-colors">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" class="w-5 h-5 mr-3">
            Ingresar con Google
        </button>

        <div id="error-message" class="text-red-500 text-xs mt-4"></div>
    </div>

    <script type="module">
        import { initFirebase, isAdmin, registerServiceWorker } from "./js/common.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        async function main() {
            try {
                const app = await initFirebase();
                const auth = getAuth(app);
                
                const googleLoginButton = document.getElementById('google-login-button');
                const errorMessage = document.getElementById('error-message');

                googleLoginButton.addEventListener('click', async () => {
                    const provider = new GoogleAuthProvider();
                    try {
                        const result = await signInWithPopup(auth, provider);
                        const user = result.user;

                        if (user) {
                            if (isAdmin(user.email)) {
                                window.location.href = '/admin-layout.html';
                            } else {
                                window.location.href = '/index.html';
                            }
                        }
                    } catch (error) {
                        console.error("Error en el inicio de sesión con Google:", error);
                        errorMessage.textContent = 'No se pudo iniciar sesión. Inténtalo de nuevo.';
                    }
                });

            } catch (error) {
                console.error("Error al inicializar Firebase:", error);
                document.getElementById('error-message').textContent = 'Error de conexión con el servidor.';
            }
            registerServiceWorker();
        }

        main();
    </script>
    
</body>
</html>
