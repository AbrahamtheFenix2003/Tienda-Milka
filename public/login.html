<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BRAHOLET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-rose-500">BRAHOLET</h1>
            <p class="text-gray-500">Panel de Administración</p>
        </div>
        
        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Correo Electrónico</label>
                <input type="email" id="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                <input type="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" required>
            </div>
            <div id="error-message" class="text-red-500 text-xs italic mb-4 hidden"></div>
            <div class="flex items-center justify-between">
                <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors">
                    Iniciar Sesión
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { initFirebase, registerServiceWorker } from "./js/common.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        async function initializeAndSetupLogin() {
            try {
                const app = await initFirebase();
                const auth = getAuth(app);

                // 3. Configura el listener del formulario
                setupLoginForm(auth);

            } catch (error) {
                console.error("Error al inicializar Firebase:", error);
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'No se pudo conectar al servidor. Inténtalo más tarde.';
                errorMessage.classList.remove('hidden');
            }
            registerServiceWorker();
        }

        function setupLoginForm(auth) {
            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                errorMessage.classList.add('hidden');

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    // Si el login es exitoso, redirigir al panel de admin
                    window.location.href = 'admin.html';
                } catch (error) {
                    console.error("Error de inicio de sesión:", error.code);
                    errorMessage.textContent = 'Correo o contraseña incorrectos.';
                    errorMessage.classList.remove('hidden');
                }
            });
        }

        // Inicia todo el proceso
        initializeAndSetupLogin();
    </script>
</body>
</html>
