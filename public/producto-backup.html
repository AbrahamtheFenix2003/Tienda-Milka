<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ✨ ETIQUETAS OPEN GRAPH POR DEFECTO ✨ -->
    <meta property="og:title" content="BRAHOLET Importaciones">
    <meta property="og:description" content="Descubre productos de calidad y las últimas novedades.">
    <meta property="og:image" content="https://braholet-importaciones.web.app/logo.png">
    <meta property="og:url" content="https://braholet-importaciones.web.app">
    <meta property="og:type" content="website">
    
    <title>Detalle del Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Performance: preconnect critical origins -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    
    <!-- Firebase Scripts (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; opacity: 1; transition: opacity 0.2s; }
        .thumbnail-image {
            border: 2px solid transparent;
            transition: border-color 0.2s ease-in-out;
        }
        .thumbnail-image.active, .thumbnail-image:hover {
            border-color: #f43f5e; /* Color rose-500 de Tailwind */
        }
        /* Asegurar que la descripción del producto se mantenga contenida y bien formateada */
        #product-description {
            overflow: hidden;
            word-wrap: break-word;
            max-width: 100%;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }
        #product-description ul, #product-description ol {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        #product-description li {
            margin-bottom: 0.25rem;
            list-style-type: disc;
        }
        /* Evitar que elementos mal formados se escapen del contenedor */
        .grid {
            overflow: hidden;
        }
        /* Ocultar cualquier li que escape al body */
        body > li {
            display: none !important;
        }
        /* Forzar que los li solo aparezcan dentro de ul o ol */
        li:not(ul li):not(ol li) {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-50">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <div class="flex space-x-1">
                        <button id="back-button" title="Atrás" class="p-2 rounded-full hover:bg-gray-200 transition-colors">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button id="forward-button" title="Adelante" class="p-2 rounded-full hover:bg-gray-200 transition-colors">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                    <div class="flex-shrink-0">
                        <a href="/index.html" class="text-2xl font-bold text-rose-500">BRAHOLET</a>
                        <p class="text-xs text-gray-400 -mt-1">IMPORTACIONES</p>
                    </div>
                </div>
                <div id="user-controls" class="flex items-center space-x-4"></div>
            </div>
        </div>
    </header>

    <main id="product-content" class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <p id="loading-message" class="text-center text-gray-500">Verificando acceso y cargando producto...</p>
    </main>
    
    <template id="product-view-template">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12">
            <div>
                <div class="aspect-square bg-gray-100 rounded-lg mb-4 shadow-sm">
                    <img
                      id="main-product-image"
                      src=""
                      alt="Imagen principal del producto"
                      class="w-full h-full object-cover rounded-lg"
                      loading="lazy"
                      decoding="async"
                      width="800"
                      height="800"
                    >
                </div>
                <div id="thumbnail-gallery" class="grid grid-cols-4 gap-2"></div>
            </div>
            <div class="flex flex-col">
                <span id="product-category" class="text-sm text-gray-500">Categoría</span>
                <h1 id="product-name" class="text-3xl font-bold text-gray-900 mt-1">Nombre del Producto</h1>
                <p id="product-stock" class="mt-2 text-sm font-semibold"></p>
                <div class="mt-4">
                    <span id="product-price" class="text-3xl font-bold text-rose-600">S/ 0.00</span>
                    <span id="product-original-price" class="text-lg text-gray-400 line-through ml-2"></span>
                </div>
                <p id="product-description" class="text-gray-600 mt-6 flex-grow">
                    Descripción del producto...
                </p>
                <div class="mt-8">
                    <!-- Título para los asesores -->
                    <h3 class="text-lg font-semibold text-gray-800 mb-4 text-center">Comunícate con nuestras asesoras:</h3>
                    
                    <!-- Contenedor para los dos botones -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- Botón existente - Milka -->
                        <a id="whatsapp-link" href="#" target="_blank" class="bg-green-500 text-white py-3 px-4 rounded-lg hover:bg-green-600 transition-colors flex items-center justify-center text-sm font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed shadow-lg hover:shadow-xl">
                            <svg class="h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 14.2l-1.5-0.8c-0.4-0.2-0.7-0.1-0.9 0.2l-0.5 0.6c-0.2 0.2-0.5 0.3-0.8 0.2C11.9 14 11 13.2 10.1 12.2c-0.9-0.9-1.7-1.8-1.9-2.8 0-0.3 0.1-0.6 0.3-0.8l0.6-0.5c0.2-0.2 0.3-0.5 0.2-0.9l-0.8-1.5c-0.2-0.4-0.6-0.6-1-0.6H5.7C5.3 4 5 4.3 5 4.7c0 0.9 0.3 1.8 0.9 2.6 0.6 0.8 1.4 1.6 2.3 2.4 1.2 1.1 2.6 2 4.2 2.4 0.2 0 0.3 0 0.5 0 0.8 0 1.6-0.3 2.2-0.9 0.6-0.6 1-1.4 1-2.2 0-0.4-0.3-0.7-0.7-0.7h-1.4c-0.4 0-0.8 0.2-1 0.6zM12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/></svg>
                            <div class="text-center">
                                <div>Asesora Milka</div>
                            </div>
                        </a>

                        <!-- Nuevo botón - Ana -->
                        <a id="whatsapp-link-ana" href="#" target="_blank" class="bg-blue-500 text-white py-3 px-4 rounded-lg hover:bg-blue-600 transition-colors flex items-center justify-center text-sm font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed shadow-lg hover:shadow-xl">
                            <svg class="h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 14.2l-1.5-0.8c-0.4-0.2-0.7-0.1-0.9 0.2l-0.5 0.6c-0.2 0.2-0.5 0.3-0.8 0.2C11.9 14 11 13.2 10.1 12.2c-0.9-0.9-1.7-1.8-1.9-2.8 0-0.3 0.1-0.6 0.3-0.8l0.6-0.5c0.2-0.2 0.3-0.5 0.2-0.9l-0.8-1.5c-0.2-0.4-0.6-0.6-1-0.6H5.7C5.3 4 5 4.3 5 4.7c0 0.9 0.3 1.8 0.9 2.6 0.6 0.8 1.4 1.6 2.3 2.4 1.2 1.1 2.6 2 4.2 2.4 0.2 0 0.3 0 0.5 0 0.8 0 1.6-0.3 2.2-0.9 0.6-0.6 1-1.4 1-2.2 0-0.4-0.3-0.7-0.7-0.7h-1.4c-0.4 0-0.8 0.2-1 0.6zM12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/></svg>
                            <div class="text-center">
                                <div>Asesora Ana</div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="./js/producto-cliente.js"></script>
    
    <script>
      // Skeleton instantáneo para mejorar percepción mientras carga JS/Auth/Data
      (function () {
        const container = document.getElementById('product-content');
        if (!container) return;
        // Si ya hay contenido real, no pintar skeleton
        if (container.querySelector('.grid')) return;

        const skeleton = document.createElement('div');
        skeleton.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 animate-pulse">
            <div>
              <div class="aspect-square bg-gray-200 rounded-lg mb-4"></div>
              <div class="grid grid-cols-4 gap-2">
                <div class="w-full aspect-square bg-gray-200 rounded-md"></div>
                <div class="w-full aspect-square bg-gray-200 rounded-md"></div>
                <div class="w-full aspect-square bg-gray-200 rounded-md"></div>
                <div class="w-full aspect-square bg-gray-200 rounded-md"></div>
              </div>
            </div>
            <div class="flex flex-col">
              <div class="h-4 w-24 bg-gray-200 rounded mb-2"></div>
              <div class="h-8 w-3/4 bg-gray-200 rounded mb-3"></div>
              <div class="h-4 w-28 bg-gray-200 rounded mb-4"></div>
              <div class="h-8 w-40 bg-gray-200 rounded mb-6"></div>
              <div class="space-y-2">
                <div class="h-3 w-full bg-gray-200 rounded"></div>
                <div class="h-3 w-5/6 bg-gray-200 rounded"></div>
                <div class="h-3 w-2/3 bg-gray-200 rounded"></div>
              </div>
              <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="h-12 bg-gray-200 rounded"></div>
                <div class="h-12 bg-gray-200 rounded"></div>
              </div>
            </div>
          </div>
        `;
        const loadingMsg = document.getElementById('loading-message');
        if (loadingMsg) loadingMsg.remove();
        container.innerHTML = '';
        container.appendChild(skeleton);
      })();
    </script>
</body>
</html>
